<script type="text/babel" data-type="module">
import React,{useState,useEffect,useRef} from 'react';
import {createRoot} from 'react-dom/client';
import {Trash2,Calendar,Users,Search,FileText,Printer,Save,PlusCircle,Edit2,Shield,RotateCcw,Image as ImageIcon,UserPlus,LogOut,LayoutDashboard,Download,Upload,RefreshCw,Key,X,Phone,UserCheck,UserX,CreditCard,Trash,Pill,AlertTriangle,FileHeart,HeartPulse,Syringe,Building2,Cloud,CloudOff,Wifi,WifiOff,ClipboardList,Menu} from 'lucide-react';

const SUPABASE_URL='https://gffhlahrjwiojdewvxws.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdmZmhsYWhyandpb2pkZXd2eHdzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY5NDA2ODYsImV4cCI6MjA4MjUxNjY4Nn0.yUdUDPYU63-70l-a2b3fqxDfb_GkX6hUveHRwaYcadc';
const supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const Role={ADMIN:'admin',ODONTOLOGO:'odontologo',USUARIO:'usuario'};

const DB={
    online:false,
    check:async()=>{try{const{error}=await supabase.from('users').select('id').limit(1);DB.online=!error;return DB.online}catch{DB.online=false;return false}},
    getAll:async(t)=>{try{const{data,error}=await supabase.from(t).select('*').order('id');if(error)throw error;return data||[]}catch(e){console.error('GET',t,e);return[]}},
    insert:async(t,r)=>{try{const{data,error}=await supabase.from(t).insert(r).select().single();if(error)throw error;return data}catch(e){console.error('INSERT',t,e);return null}},
    update:async(t,id,r)=>{try{const{data,error}=await supabase.from(t).update(r).eq('id',id).select().single();if(error)throw error;return data}catch(e){console.error('UPDATE',t,e);return null}},
    delete:async(t,id)=>{try{const{error}=await supabase.from(t).delete().eq('id',id);return!error}catch{return false}}
};

const S={
    init:async()=>{const ok=await DB.check();if(ok){const u=await DB.getAll('users');if(!u.length)await DB.insert('users',{username:'Admin',password:'10680',name:'Administrador',role:Role.ADMIN})}return ok},
    getUsers:()=>DB.getAll('users'),
    saveUser:async u=>u.id?DB.update('users',u.id,u):DB.insert('users',u),
    delUser:id=>DB.delete('users',id),
    getPatients:async()=>(await DB.getAll('patients')).filter(p=>!p.deleted),
    savePatient:async p=>p.id?DB.update('patients',p.id,p):DB.insert('patients',p),
    delPatient:id=>DB.update('patients',id,{deleted:true}),
    getApps:async()=>(await DB.getAll('appointments')).filter(a=>!a.deleted),
    saveApp:async a=>a.id?DB.update('appointments',a.id,a):DB.insert('appointments',a),
    delApp:id=>DB.update('appointments',id,{deleted:true}),
    getHist:async pid=>(await DB.getAll('history')).filter(h=>String(h.paciente_id)===String(pid)&&!h.deleted).sort((a,b)=>b.id-a.id),
    saveHist:h=>DB.insert('history',h),
    getImgs:async pid=>(await DB.getAll('images')).filter(i=>String(i.paciente_id)===String(pid)&&!i.deleted),
    saveImg:i=>DB.insert('images',i),
    delImg:id=>DB.update('images',id,{deleted:true}),
    getMed:async pid=>{const all=await DB.getAll('medical_records');return all.find(r=>String(r.paciente_id)===String(pid))||null},
    saveMed:async r=>{const ex=await S.getMed(r.paciente_id);return ex?DB.update('medical_records',ex.id,r):DB.insert('medical_records',r)},
    hasCond:async pid=>{const r=await S.getMed(pid);if(!r)return false;return(r.alergias?.length>0)||(r.alergias_medicamentos?.length>0)||(r.medicacion_actual?.length>0)||Object.entries(r.antecedentes_personales||{}).some(([k,v])=>k!=='otros'&&v===true)},
    export:async()=>JSON.stringify({users:await DB.getAll('users'),patients:await DB.getAll('patients'),appointments:await DB.getAll('appointments'),history:await DB.getAll('history'),images:await DB.getAll('images'),medical_records:await DB.getAll('medical_records')},null,2),
    import:async json=>{try{const d=JSON.parse(json);for(const[t,rows]of Object.entries(d))for(const r of rows)await supabase.from(t).upsert(r);return true}catch{return false}}
};

const isPast=(d,t)=>d&&t?new Date(d+'T'+t)<new Date():false;
const compress=file=>new Promise(res=>{const r=new FileReader();r.readAsDataURL(file);r.onload=e=>{const img=new Image();img.src=e.target.result;img.onload=()=>{const c=document.createElement('canvas');let w=img.width,h=img.height;const M=800;if(w>h&&w>M){h*=M/w;w=M}else if(h>M){w*=M/h;h=M}c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);res(c.toDataURL('image/jpeg',0.6))}}});

const Status=({on})=><div className={`flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[10px] font-bold ${on?'bg-emerald-100 text-emerald-700':'bg-red-100 text-red-700'}`}>{on?<><Wifi size={12}/>Online</>:<><WifiOff size={12}/>Offline</>}</div>;
const Modal=({src,onClose})=><div className="fixed inset-0 bg-black/90 flex items-center justify-center z-50 p-4" onClick={onClose}><img src={src} className="max-w-full max-h-full rounded-lg"/></div>;

const Login=({onLogin,online})=>{
    const[u,setU]=useState('');const[p,setP]=useState('');const[err,setErr]=useState('');const[loading,setLoading]=useState(false);
    const submit=async e=>{e.preventDefault();if(!u||!p)return setErr('Complete todos los campos');setLoading(true);setErr('');const email=u.includes('@')?u:`${u}@local.com`;try{const{data,error}=await supabase.auth.signInWithPassword({email,password:p});if(error)throw error;const users=await S.getUsers();const user=users.find(x=>x.email===email);if(user){onLogin(user)}else{await supabase.auth.signOut();setErr('Usuario no encontrado en el sistema')}}catch(e){setErr('Credenciales incorrectas')}finally{setLoading(false)}};
    return<div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-brand-600 to-indigo-900 p-4 safe-top safe-bottom"><div className="w-full max-w-sm bg-white rounded-2xl shadow-2xl p-6 text-center"><Cloud size={40} className="mx-auto text-brand-600 mb-2"/><h1 className="text-2xl font-bold text-brand-600 mb-1">🦷 Arte Dental</h1><p className="text-[10px] text-gray-400 mb-2">Sistema en la Nube</p><div className="mb-4 flex justify-center"><Status on={online}/></div><form onSubmit={submit} className="space-y-3"><input type="text" value={u} onChange={e=>setU(e.target.value)} className="w-full p-3 border rounded-xl font-medium" placeholder="Usuario" autoComplete="username"/><input type="password" value={p} onChange={e=>setP(e.target.value)} className="w-full p-3 border rounded-xl font-medium" placeholder="Contraseña" autoComplete="current-password"/>{err&&<p className="text-red-500 text-xs font-medium">{err}</p>}<button type="submit" disabled={loading||!online} className="w-full bg-brand-600 text-white font-bold py-3 rounded-xl disabled:opacity-50">{loading?'Conectando...':online?'Ingresar':'Sin conexión'}</button></form></div></div>
};

const Agenda=({user})=>{
    const[apps,setApps]=useState([]);const[pts,setPts]=useState([]);const[users,setUsers]=useState([]);
    const[search,setSearch]=useState('');const[showList,setShowList]=useState(false);const[tab,setTab]=useState('prox');
    const[form,setForm]=useState({pid:'',dr:'',date:new Date().toISOString().split('T')[0],time:'',tto:''});
    const[cond,setCond]=useState({});const[saving,setSaving]=useState(false);

    useEffect(()=>{load()},[]);
    const load=async()=>{const[a,p,u]=await Promise.all([S.getApps(),S.getPatients(),S.getUsers()]);setApps(a);setPts(p);setUsers(u);const c={};for(const pt of p)c[pt.id]=await S.hasCond(pt.id);setCond(c)};

    const submit=async()=>{
        if(!form.pid||!form.dr||!form.time||!form.date)return alert('Complete todos los campos');
        if(new Date(form.date+'T'+form.time)<new Date())return alert('Fecha/hora pasada');
        const exists=apps.find(a=>a.odontologo===form.dr&&a.fecha===form.date&&a.hora===form.time);
        if(exists)return alert('Horario ocupado');
        const p=pts.find(x=>x.id===form.pid);
        if(!p)return alert('Seleccione paciente');
        setSaving(true);
        const appData={paciente_id:p.id,paciente_nombre:p.nombre,paciente_ci:p.ci,odontologo:form.dr,fecha:form.date,hora:form.time,tratamiento:form.tto||'',asistio:null,deleted:false};
        const result=await S.saveApp(appData);
        if(result){
            await S.saveHist({paciente_id:p.id,fecha:new Date().toLocaleDateString(),odontologo:form.dr,motivo:'CITA AGENDADA: '+form.date+' '+form.time,tipo:'CITA',deleted:false});
            setForm({pid:'',dr:'',date:new Date().toISOString().split('T')[0],time:'',tto:''});setSearch('');
            await load();
        }else{alert('Error al guardar')}
        setSaving(false);
    };

    const toggle=async(id,val)=>{const a=apps.find(x=>x.id===id);if(a){await S.saveApp({...a,asistio:val});load()}};
    const list=tab==='prox'?apps.filter(a=>!isPast(a.fecha,a.hora)).sort((a,b)=>new Date(a.fecha+'T'+a.hora)-new Date(b.fecha+'T'+b.hora)):apps.filter(a=>isPast(a.fecha,a.hora)).sort((a,b)=>new Date(b.fecha+'T'+b.hora)-new Date(a.fecha+'T'+a.hora));

    return<div className="space-y-4 animate-fade-in">
        <div className="bg-white p-4 rounded-xl border shadow-sm">
            <h2 className="font-bold mb-3 text-brand-600 uppercase text-xs flex items-center gap-2"><Calendar size={16}/>Agendar</h2>
            <div className="space-y-3">
                <div className="relative">
                    <input type="text" placeholder="Buscar paciente..." value={search} onChange={e=>{setSearch(e.target.value);setShowList(true)}} className="w-full p-2.5 border rounded-lg text-sm font-medium"/>
                    {showList&&search&&<div className="absolute z-20 w-full bg-white border rounded-lg shadow-lg max-h-40 overflow-auto">{pts.filter(p=>(p.nombre||'').toLowerCase().includes(search.toLowerCase())).map(p=><div key={p.id} onClick={()=>{setForm({...form,pid:p.id});setSearch(p.nombre);setShowList(false)}} className={`p-2.5 text-sm font-medium border-b active:bg-brand-100 ${cond[p.id]?'bg-pink-50':''}`}>{p.nombre}{cond[p.id]&&<span className="ml-2 bg-pink-500 text-white text-[8px] px-1.5 py-0.5 rounded-full">⚠️</span>}</div>)}</div>}
                </div>
                <select value={form.dr} onChange={e=>setForm({...form,dr:e.target.value})} className="w-full p-2.5 border rounded-lg text-sm font-medium"><option value="">Profesional...</option>{users.filter(u=>u.role===Role.ODONTOLOGO).map(o=><option key={o.id} value={o.name}>{o.name}</option>)}</select>
                <div className="grid grid-cols-2 gap-2"><input type="date" value={form.date} min={new Date().toISOString().split('T')[0]} onChange={e=>setForm({...form,date:e.target.value})} className="p-2.5 border rounded-lg text-sm font-medium"/><input type="time" value={form.time} onChange={e=>setForm({...form,time:e.target.value})} className="p-2.5 border rounded-lg text-sm font-medium"/></div>
                <textarea value={form.tto} onChange={e=>setForm({...form,tto:e.target.value})} className="w-full p-2.5 border rounded-lg text-sm h-16 resize-none" placeholder="Descripción..."/>
                <button onClick={submit} disabled={saving} className="w-full bg-brand-600 text-white font-bold py-3 rounded-xl text-sm disabled:opacity-50">{saving?'Guardando...':'Confirmar Cita'}</button>
            </div>
        </div>
        <div className="bg-white rounded-xl border overflow-hidden">
            <div className="flex border-b"><button onClick={()=>setTab('prox')} className={`flex-1 py-3 text-xs font-bold ${tab==='prox'?'bg-brand-50 text-brand-600 border-b-2 border-brand-600':'text-gray-400'}`}>Próximos</button><button onClick={()=>setTab('past')} className={`flex-1 py-3 text-xs font-bold ${tab==='past'?'bg-brand-50 text-brand-600 border-b-2 border-brand-600':'text-gray-400'}`}>Pasados</button></div>
            <div className="divide-y max-h-[50vh] overflow-auto">
                {list.map(a=><div key={a.id} className={`p-3 ${cond[a.paciente_id]?'medical-alert':''}`}>
                    <div className="flex justify-between items-start">
                        <div><p className="font-bold text-sm">{a.paciente_nombre}{cond[a.paciente_id]&&<HeartPulse size={14} className="text-pink-500 inline ml-1"/>}</p><p className="text-xs text-gray-500">{a.fecha} {a.hora} • Dr. {a.odontologo}</p></div>
                        <div className="flex gap-1"><button onClick={()=>toggle(a.id,true)} className={`p-1.5 rounded ${a.asistio===true?'bg-emerald-600 text-white':'bg-gray-100 text-gray-400'}`}><UserCheck size={14}/></button><button onClick={()=>toggle(a.id,false)} className={`p-1.5 rounded ${a.asistio===false?'bg-red-600 text-white':'bg-gray-100 text-gray-400'}`}><UserX size={14}/></button><button onClick={async()=>{if(confirm('¿Eliminar?')){await S.delApp(a.id);load()}}} className="p-1.5 text-red-400"><Trash2 size={14}/></button></div>
                    </div>
                </div>)}
                {list.length===0&&<div className="p-8 text-center text-gray-300 text-xs font-bold">Sin citas</div>}
            </div>
        </div>
    </div>
};

const Patients=({user,onHist,onMed})=>{
    const[pts,setPts]=useState([]);const[search,setSearch]=useState('');
    const[form,setForm]=useState({nombre:'',ci:'',telefono:'',email:''});const[editId,setEditId]=useState(null);
    const[cond,setCond]=useState({});const[saving,setSaving]=useState(false);const[ciDisplay,setCiDisplay]=useState('');

    useEffect(()=>{load()},[]);
    const load=async()=>{const p=await S.getPatients();setPts(p);const c={};for(const pt of p)c[pt.id]=await S.hasCond(pt.id);setCond(c)};
    const formatCI=ci=>{if(!ci)return '';const nums=ci.replace(/\D/g,'');if(nums.length<=1)return nums;if(nums.length<=4)return nums.replace(/(\d{1})(\d{1,3})/,'$1.$2');if(nums.length<=7)return nums.replace(/(\d{1})(\d{3})(\d{1,3})/,'$1.$2.$3');return nums.replace(/(\d{1})(\d{3})(\d{3})(\d{1})/,'$1.$2.$3-$4').substring(0,12)};
    const handleCIChange=e=>{const raw=e.target.value.replace(/\D/g,'').substring(0,8);setForm({...form,ci:raw});setCiDisplay(formatCI(raw))};
    const submit=async()=>{if(!form.nombre||!form.ci)return alert('Nombre y CI obligatorios');const ciDuplicate=pts.find(p=>p.ci===form.ci&&(!editId||p.id!==editId));if(ciDuplicate)return alert(`Ya existe un paciente con CI ${formatCI(form.ci)}:\n${ciDuplicate.nombre}`);setSaving(true);try{if(editId)await S.savePatient({id:editId,...form});else await S.savePatient(form);setForm({nombre:'',ci:'',telefono:'',email:''});setCiDisplay('');setEditId(null);await load()}finally{setSaving(false)}};
    const delPatient=async(p)=>{if(!confirm(`¿Eliminar paciente ${p.nombre}?`))return;if(!confirm('¿Está seguro? Esta acción no se puede deshacer'))return;await S.delPatient(p.id);load()};

    return<div className="space-y-4 animate-fade-in">
        <div className="bg-white p-4 rounded-xl border">
            <h2 className="font-bold mb-3 text-brand-600 uppercase text-xs"><UserPlus size={14} className="inline mr-1"/>{editId?'Editar':'Nuevo'}</h2>
            <div className="grid grid-cols-2 gap-2">
                <input placeholder="Nombre *" value={form.nombre} onChange={e=>setForm({...form,nombre:e.target.value})} className="p-2.5 border rounded-lg text-sm col-span-2" disabled={saving}/>
                <input placeholder="CI * (ej: 2.555.555-3)" value={ciDisplay} onChange={handleCIChange} className="p-2.5 border rounded-lg text-sm" disabled={saving}/>
                <input placeholder="Teléfono" value={form.telefono} onChange={e=>setForm({...form,telefono:e.target.value})} className="p-2.5 border rounded-lg text-sm" disabled={saving}/>
            </div>
            <div className="flex gap-2 mt-3"><button onClick={submit} disabled={saving} className="flex-1 bg-brand-600 text-white py-2.5 rounded-xl font-bold text-sm disabled:opacity-50">{saving?'Guardando...':'Guardar'}</button>{editId&&<button onClick={()=>{setEditId(null);setForm({nombre:'',ci:'',telefono:'',email:''});setCiDisplay('')}} disabled={saving} className="px-4 bg-gray-200 text-gray-600 py-2.5 rounded-xl font-bold text-sm disabled:opacity-50">✕</button>}</div>
        </div>
        <div className="bg-white rounded-xl border overflow-hidden">
            <div className="p-3 border-b bg-gray-50"><div className="relative"><Search className="absolute left-2.5 top-1/2 -translate-y-1/2 text-gray-400" size={14}/><input placeholder="Buscar..." value={search} onChange={e=>setSearch(e.target.value)} className="w-full pl-8 pr-3 py-2 border rounded-lg text-sm"/></div></div>
            <div className="divide-y max-h-[60vh] overflow-auto">
                {pts.filter(p=>(p.nombre||'').toLowerCase().includes(search.toLowerCase())||(p.ci||'').includes(search)).map(p=><div key={p.id} className={`p-3 ${cond[p.id]?'medical-alert':''}`}>
                    <div className="flex justify-between items-center">
                        <div><p className="font-bold text-sm">{p.nombre}{cond[p.id]&&<span className="ml-1 bg-pink-500 text-white text-[8px] px-1.5 py-0.5 rounded-full">⚠️</span>}</p><p className="text-[10px] text-gray-400">CI: {formatCI(p.ci)} • Tel: {p.telefono||'-'}</p></div>
                        <div className="flex gap-1">
                            <button onClick={()=>{setEditId(p.id);setForm({nombre:p.nombre,ci:p.ci,telefono:p.telefono||'',email:p.email||''});setCiDisplay(formatCI(p.ci))}} className="p-2 text-brand-500"><Edit2 size={14}/></button>
                            <button onClick={()=>onMed(p.id)} className="p-2 text-pink-500"><FileHeart size={14}/></button>
                            <button onClick={()=>onHist(p.id)} className="p-2 text-brand-500"><FileText size={14}/></button>
                            <button onClick={()=>delPatient(p)} className="p-2 text-red-500 hover:bg-red-50 rounded"><Trash2 size={14}/></button>
                        </div>
                    </div>
                </div>)}
            </div>
        </div>
    </div>
};

const Medical=({user,initId})=>{
    const[pts,setPts]=useState([]);const[selId,setSelId]=useState(initId||'');const[rec,setRec]=useState(null);
    const[newA,setNewA]=useState('');const[newMA,setNewMA]=useState('');const[newMed,setNewMed]=useState({nombre:'',dosis:''});

    useEffect(()=>{S.getPatients().then(setPts)},[]);
    useEffect(()=>{if(selId)loadRec()},[selId]);

    const loadRec=async()=>{const r=await S.getMed(selId);setRec(r||{paciente_id:parseInt(selId),antecedentes_familiares:{},antecedentes_personales:{},alergias:[],alergias_medicamentos:[],medicacion_actual:[],derivado_de:{es_derivado:false},observaciones:'',fecha_actualizacion:new Date().toLocaleDateString()})};
    const save=async()=>{await S.saveMed({...rec,fecha_actualizacion:new Date().toLocaleDateString()});await S.saveHist({paciente_id:parseInt(selId),fecha:new Date().toLocaleDateString(),odontologo:'Sistema',motivo:'FICHA MÉDICA ACTUALIZADA',tipo:'SISTEMA',deleted:false});alert('Guardado');loadRec()};
    const patient=pts.find(p=>String(p.id)===String(selId));

    return<div className="space-y-4 animate-fade-in">
        <div className="bg-gradient-to-r from-pink-500 to-purple-600 p-4 rounded-xl text-white">
            <div className="flex items-center gap-2 mb-3"><FileHeart size={24}/><h2 className="text-lg font-bold">Ficha Médica</h2></div>
            <select value={selId} onChange={e=>setSelId(e.target.value)} className="w-full p-2.5 rounded-lg text-gray-800 font-medium text-sm"><option value="">Seleccionar paciente...</option>{pts.map(p=><option key={p.id} value={p.id}>{p.nombre}</option>)}</select>
        </div>
        {patient&&rec&&<div className="space-y-4">
            <div className="bg-purple-50 p-4 rounded-xl border border-purple-100">
                <h3 className="text-xs font-bold text-purple-700 mb-2 uppercase">Antecedentes Familiares</h3>
                <div className="grid grid-cols-2 gap-2">{['diabetes','hipertension','cardiopatias','cancer'].map(k=><label key={k} className="flex items-center gap-2 p-2 bg-white rounded-lg text-xs"><input type="checkbox" checked={rec.antecedentes_familiares?.[k]||false} onChange={e=>setRec({...rec,antecedentes_familiares:{...rec.antecedentes_familiares,[k]:e.target.checked}})} className="accent-purple-600"/>{k.charAt(0).toUpperCase()+k.slice(1)}</label>)}</div>
            </div>
            <div className="bg-blue-50 p-4 rounded-xl border border-blue-100">
                <h3 className="text-xs font-bold text-blue-700 mb-2 uppercase">Antecedentes Personales</h3>
                <div className="grid grid-cols-3 gap-2">{['diabetes','hipertension','cardiopatia','hepatitis','asma','epilepsia','embarazo','fumador'].map(k=><label key={k} className="flex items-center gap-1 p-1.5 bg-white rounded-lg text-[10px]"><input type="checkbox" checked={rec.antecedentes_personales?.[k]||false} onChange={e=>setRec({...rec,antecedentes_personales:{...rec.antecedentes_personales,[k]:e.target.checked}})} className="accent-blue-600"/>{k.charAt(0).toUpperCase()+k.slice(1)}</label>)}</div>
            </div>
            <div className="bg-red-50 p-4 rounded-xl border border-red-100">
                <h3 className="text-xs font-bold text-red-700 mb-2 uppercase">Alergias</h3>
                <div className="flex gap-2 mb-2"><input placeholder="Nueva alergia..." value={newA} onChange={e=>setNewA(e.target.value)} className="flex-1 p-2 border rounded-lg text-sm"/><button onClick={()=>newA.trim()&&(setRec({...rec,alergias:[...(rec.alergias||[]),newA.trim()]}),setNewA(''))} className="px-3 bg-red-600 text-white rounded-lg text-xs font-bold">+</button></div>
                <div className="flex flex-wrap gap-1">{(rec.alergias||[]).map((a,i)=><span key={i} className="bg-red-200 text-red-800 px-2 py-1 rounded-full text-xs flex items-center gap-1">{a}<button onClick={()=>setRec({...rec,alergias:rec.alergias.filter((_,x)=>x!==i)})}>×</button></span>)}</div>
            </div>
            <div className="bg-orange-50 p-4 rounded-xl border border-orange-100">
                <h3 className="text-xs font-bold text-orange-700 mb-2 uppercase">Alergias Medicamentos</h3>
                <div className="flex gap-2 mb-2"><input placeholder="Medicamento..." value={newMA} onChange={e=>setNewMA(e.target.value)} className="flex-1 p-2 border rounded-lg text-sm"/><button onClick={()=>newMA.trim()&&(setRec({...rec,alergias_medicamentos:[...(rec.alergias_medicamentos||[]),newMA.trim()]}),setNewMA(''))} className="px-3 bg-orange-600 text-white rounded-lg text-xs font-bold">+</button></div>
                <div className="flex flex-wrap gap-1">{(rec.alergias_medicamentos||[]).map((a,i)=><span key={i} className="bg-orange-200 text-orange-800 px-2 py-1 rounded-full text-xs flex items-center gap-1">💊{a}<button onClick={()=>setRec({...rec,alergias_medicamentos:rec.alergias_medicamentos.filter((_,x)=>x!==i)})}>×</button></span>)}</div>
            </div>
            <div className="bg-emerald-50 p-4 rounded-xl border border-emerald-100">
                <h3 className="text-xs font-bold text-emerald-700 mb-2 uppercase">Medicación Actual</h3>
                <div className="flex gap-2 mb-2"><input placeholder="Medicamento" value={newMed.nombre} onChange={e=>setNewMed({...newMed,nombre:e.target.value})} className="flex-1 p-2 border rounded-lg text-xs"/><input placeholder="Dosis" value={newMed.dosis} onChange={e=>setNewMed({...newMed,dosis:e.target.value})} className="w-16 p-2 border rounded-lg text-xs"/><button onClick={()=>newMed.nombre.trim()&&(setRec({...rec,medicacion_actual:[...(rec.medicacion_actual||[]),{...newMed}]}),setNewMed({nombre:'',dosis:''}))} className="px-3 bg-emerald-600 text-white rounded-lg text-xs font-bold">+</button></div>
                <div className="space-y-1">{(rec.medicacion_actual||[]).map((m,i)=><div key={i} className="bg-white p-2 rounded-lg border flex justify-between text-xs"><span>{m.nombre} {m.dosis&&<span className="text-gray-400">({m.dosis})</span>}</span><button onClick={()=>setRec({...rec,medicacion_actual:rec.medicacion_actual.filter((_,x)=>x!==i)})} className="text-red-400">×</button></div>)}</div>
            </div>
            <div className="bg-slate-100 p-4 rounded-xl border">
                <h3 className="text-xs font-bold text-slate-700 mb-2 uppercase">Observaciones</h3>
                <textarea placeholder="Notas..." value={rec.observaciones||''} onChange={e=>setRec({...rec,observaciones:e.target.value})} className="w-full p-2 border rounded-lg text-sm h-20 resize-none"/>
            </div>
            <button onClick={save} className="w-full bg-gradient-to-r from-pink-500 to-purple-600 text-white py-4 rounded-xl font-bold"><Save size={18} className="inline mr-2"/>Guardar</button>
        </div>}
        {!selId&&<div className="bg-white rounded-xl p-12 text-center border"><FileHeart size={40} className="mx-auto text-gray-200 mb-2"/><p className="text-gray-400 text-sm">Seleccione paciente</p></div>}
    </div>
};

const History=({user,initId})=>{
    const[pts,setPts]=useState([]);const[selId,setSelId]=useState(initId||'');
    const[hist,setHist]=useState([]);const[imgs,setImgs]=useState([]);const[users,setUsers]=useState([]);const[medRec,setMedRec]=useState(null);
    const[view,setView]=useState('evo');const[form,setForm]=useState({tto:'',dr:user.role===Role.ODONTOLOGO?user.name:''});
    const[presForm,setPresForm]=useState({monto:'',motivo:''});const[pago,setPago]=useState('');
    const[fullImg,setFullImg]=useState(null);const[uploading,setUploading]=useState(false);

    useEffect(()=>{Promise.all([S.getPatients(),S.getUsers()]).then(([p,u])=>{setPts(p);setUsers(u.filter(x=>x.role===Role.ODONTOLOGO))})},[]);
    useEffect(()=>{if(selId)load()},[selId]);

    const load=async()=>{setHist(await S.getHist(selId));setImgs(await S.getImgs(selId));setMedRec(await S.getMed(selId))};
    const patient=pts.find(p=>String(p.id)===String(selId));

    const saveEvo=async()=>{if(!form.tto||!form.dr)return alert('Complete campos');await S.saveHist({paciente_id:parseInt(selId),fecha:new Date().toLocaleDateString(),odontologo:form.dr,motivo:form.tto,tipo:'EVOLUCION',deleted:false});setForm({tto:'',dr:user.role===Role.ODONTOLOGO?user.name:form.dr});load()};

    const saveFin=async()=>{
        const addB=parseFloat(presForm.monto)||0;const addP=parseFloat(pago)||0;
        if(!addB&&!addP)return;
        let newB=patient.presupuesto||0;let newA=patient.abonado||0;
        if(addB>0){if(!presForm.motivo)return alert('Indique motivo');newB+=addB;await S.saveHist({paciente_id:parseInt(selId),fecha:new Date().toLocaleDateString(),odontologo:user.name,motivo:'PRESUPUESTO: $'+addB+' - '+presForm.motivo,tipo:'PRESUPUESTO',deleted:false})}
        if(addP>0){newA+=addP;await S.saveHist({paciente_id:parseInt(selId),fecha:new Date().toLocaleDateString(),odontologo:user.name,motivo:'ABONO: $'+addP,tipo:'PAGO',deleted:false})}
        if(newB>0&&newA>=newB){await S.saveHist({paciente_id:parseInt(selId),fecha:new Date().toLocaleDateString(),odontologo:user.name,motivo:'CUENTA SALDADA',tipo:'SISTEMA',deleted:false});newB=0;newA=0;alert('¡Saldado!')}
        await S.savePatient({...patient,presupuesto:newB,abonado:newA});setPresForm({monto:'',motivo:''});setPago('');setPts(await S.getPatients());load()
    };

    const addPhoto=async e=>{const files=Array.from(e.target.files);if(!files.length)return;setUploading(true);for(const f of files){const d=await compress(f);await S.saveImg({paciente_id:parseInt(selId),data:d,date:new Date().toLocaleDateString(),deleted:false})}setUploading(false);load()};

    return<div className="space-y-4 animate-fade-in">
        <div className="bg-white p-3 rounded-xl border"><select value={selId} onChange={e=>setSelId(e.target.value)} className="w-full p-2 border rounded-lg font-medium text-sm"><option value="">Seleccionar paciente...</option>{pts.map(p=><option key={p.id} value={p.id}>{p.nombre}</option>)}</select></div>
        {patient&&<>
            {medRec&&(medRec.alergias?.length>0||medRec.alergias_medicamentos?.length>0)&&<div className="bg-red-500 text-white p-3 rounded-xl flex items-center gap-2 text-sm font-medium"><AlertTriangle size={16}/>ALERGIAS: {[...(medRec.alergias||[]),...(medRec.alergias_medicamentos||[])].join(', ')}</div>}
            <div className="bg-white p-4 rounded-xl border">
                <h3 className="font-bold text-sm mb-2">{patient.nombre}</h3>
                <div className="grid grid-cols-3 gap-2 text-center mb-3 p-3 bg-slate-900 rounded-lg text-white">
                    <div><span className="text-[10px] text-slate-400 block">Presup.</span><span className="font-bold text-brand-400">${patient.presupuesto||0}</span></div>
                    <div><span className="text-[10px] text-slate-400 block">Abonado</span><span className="font-bold text-emerald-400">${patient.abonado||0}</span></div>
                    <div><span className="text-[10px] text-slate-400 block">Saldo</span><span className="font-bold text-red-400">${Math.max(0,(patient.presupuesto||0)-(patient.abonado||0))}</span></div>
                </div>
                <div className="space-y-2">
                    <input placeholder="Motivo presupuesto" value={presForm.motivo} onChange={e=>setPresForm({...presForm,motivo:e.target.value})} className="w-full p-2 border rounded-lg text-sm"/>
                    <div className="grid grid-cols-2 gap-2"><input type="number" placeholder="Presupuesto $" value={presForm.monto} onChange={e=>setPresForm({...presForm,monto:e.target.value})} className="p-2 border rounded-lg text-sm"/><input type="number" placeholder="Pago $" value={pago} onChange={e=>setPago(e.target.value)} className="p-2 border rounded-lg text-sm"/></div>
                    <button onClick={saveFin} className="w-full bg-slate-800 text-white py-2 rounded-lg font-bold text-sm">Actualizar</button>
                </div>
            </div>
            <div className="bg-white p-4 rounded-xl border">
                <h3 className="font-bold text-sm mb-2"><PlusCircle size={14} className="inline mr-1"/>Nueva Evolución</h3>
                <select value={form.dr} onChange={e=>setForm({...form,dr:e.target.value})} className="w-full p-2 border rounded-lg text-sm mb-2"><option value="">Odontólogo...</option>{users.map(u=><option key={u.id} value={u.name}>{u.name}</option>)}</select>
                <textarea value={form.tto} onChange={e=>setForm({...form,tto:e.target.value})} className="w-full p-2 border rounded-lg text-sm h-20 resize-none mb-2" placeholder="Tratamiento..."/>
                <button onClick={saveEvo} className="w-full bg-brand-600 text-white py-2 rounded-lg font-bold text-sm">Guardar</button>
            </div>
            <div className="bg-white rounded-xl border overflow-hidden">
                <div className="flex border-b"><button onClick={()=>setView('evo')} className={`flex-1 py-2 text-xs font-bold ${view==='evo'?'bg-brand-50 text-brand-600':'text-gray-400'}`}><ClipboardList size={14} className="inline mr-1"/>Historial</button><button onClick={()=>setView('img')} className={`flex-1 py-2 text-xs font-bold ${view==='img'?'bg-brand-50 text-brand-600':'text-gray-400'}`}><ImageIcon size={14} className="inline mr-1"/>Fotos</button></div>
                <div className="max-h-[40vh] overflow-auto">
                    {view==='evo'?<div className="divide-y">{hist.map(h=><div key={h.id} className={`p-3 border-l-4 ${h.tipo==='PAGO'?'border-emerald-500 bg-emerald-50':h.tipo==='PRESUPUESTO'?'border-indigo-500 bg-indigo-50':h.tipo==='CITA'?'border-amber-500 bg-amber-50':h.tipo==='SISTEMA'?'border-slate-800 bg-slate-100':'border-brand-500'}`}><div className="flex justify-between text-[10px] font-bold text-gray-500 mb-1"><span>{h.fecha}</span><span>{h.tipo==='EVOLUCION'?'Dr. '+h.odontologo:h.tipo}</span></div><p className="text-sm">{h.motivo}</p></div>)}{hist.length===0&&<div className="p-8 text-center text-gray-300 text-xs">Sin registros</div>}</div>
                    :<div className="p-3 grid grid-cols-3 gap-2"><label className="aspect-square border-2 border-dashed rounded-lg flex flex-col items-center justify-center cursor-pointer">{uploading?<RefreshCw className="animate-spin" size={20}/>:<><Upload size={20} className="text-gray-400"/><span className="text-[10px] text-gray-400">Subir</span></>}<input type="file" multiple accept="image/*" onChange={addPhoto} className="hidden" disabled={uploading}/></label>{imgs.map(i=><div key={i.id} className="relative aspect-square rounded-lg overflow-hidden border"><img src={i.data} className="w-full h-full object-cover" onClick={()=>setFullImg(i.data)}/><button onClick={async()=>{if(confirm('¿Borrar?')){await S.delImg(i.id);load()}}} className="absolute top-1 right-1 bg-red-500 text-white p-0.5 rounded text-[10px]">×</button></div>)}</div>}
                </div>
            </div>
        </>}
        {fullImg&&<Modal src={fullImg} onClose={()=>setFullImg(null)}/>}
    </div>
};

const Admin=({user,online})=>{
    const isAdmin=user.role===Role.ADMIN;
    const[tab,setTab]=useState(isAdmin?'users':'backup');
    const[users,setUsers]=useState([]);const[uForm,setUForm]=useState({name:'',username:'',password:'',role:Role.USUARIO});const[editId,setEditId]=useState(null);
    const fileRef=useRef();

    useEffect(()=>{if(tab==='users')S.getUsers().then(setUsers)},[tab]);
    const saveUser=async()=>{if(!uForm.name||!uForm.username||!uForm.password)return alert('Complete campos');if(editId)await S.saveUser({id:editId,...uForm});else await S.saveUser(uForm);setUForm({name:'',username:'',password:'',role:Role.USUARIO});setEditId(null);setUsers(await S.getUsers());alert('Guardado')};

    return<div className="space-y-4 animate-fade-in">
        <div className="flex gap-2 overflow-x-auto pb-2">{isAdmin&&<button onClick={()=>setTab('users')} className={`px-4 py-2 rounded-lg text-xs font-bold whitespace-nowrap ${tab==='users'?'bg-brand-600 text-white':'bg-white border text-gray-500'}`}>Usuarios</button>}<button onClick={()=>setTab('backup')} className={`px-4 py-2 rounded-lg text-xs font-bold whitespace-nowrap ${tab==='backup'?'bg-emerald-600 text-white':'bg-white border text-gray-500'}`}>Backup</button><button onClick={()=>setTab('info')} className={`px-4 py-2 rounded-lg text-xs font-bold whitespace-nowrap ${tab==='info'?'bg-indigo-600 text-white':'bg-white border text-gray-500'}`}>Sistema</button></div>
        
        {tab==='users'&&isAdmin&&<div className="space-y-4">
            <div className="bg-white p-4 rounded-xl border">
                <h3 className="font-bold text-xs uppercase text-brand-600 mb-3">{editId?'Editar':'Nuevo'} Usuario</h3>
                <div className="space-y-2">
                    <input placeholder="Nombre" value={uForm.name} onChange={e=>setUForm({...uForm,name:e.target.value})} className="w-full p-2.5 border rounded-lg text-sm"/>
                    <input placeholder="Usuario" value={uForm.username} onChange={e=>setUForm({...uForm,username:e.target.value})} className="w-full p-2.5 border rounded-lg text-sm"/>
                    <input placeholder="Contraseña" value={uForm.password} onChange={e=>setUForm({...uForm,password:e.target.value})} className="w-full p-2.5 border rounded-lg text-sm"/>
                    <select value={uForm.role} onChange={e=>setUForm({...uForm,role:e.target.value})} className="w-full p-2.5 border rounded-lg text-sm font-medium"><option value={Role.USUARIO}>Usuario</option><option value={Role.ODONTOLOGO}>Odontólogo</option><option value={Role.ADMIN}>Administrador</option></select>
                    <button onClick={saveUser} className="w-full bg-brand-600 text-white py-2.5 rounded-xl font-bold text-sm">Guardar</button>
                    {editId&&<button onClick={()=>{setEditId(null);setUForm({name:'',username:'',password:'',role:Role.USUARIO})}} className="w-full bg-gray-200 text-gray-600 py-2 rounded-xl font-bold text-sm">Cancelar</button>}
                </div>
            </div>
            <div className="bg-white rounded-xl border overflow-hidden divide-y">{users.map(u=><div key={u.id} className="p-3 flex justify-between items-center"><div><p className="font-bold text-sm">{u.name}</p><p className="text-[10px] text-gray-400">@{u.username} • {u.role}</p></div><div className="flex gap-1"><button onClick={()=>{setEditId(u.id);setUForm({name:u.name,username:u.username,password:u.password,role:u.role})}} className="p-2 text-brand-500"><Edit2 size={14}/></button><button onClick={async()=>{if(u.id===1)return alert('No se puede eliminar Admin');if(confirm('¿Eliminar?')){await S.delUser(u.id);setUsers(await S.getUsers())}}} className="p-2 text-red-400"><Trash2 size={14}/></button></div></div>)}</div>
        </div>}

        {tab==='backup'&&<div className="space-y-4">
            <div className="bg-white p-6 rounded-xl border text-center"><Download size={32} className="mx-auto text-brand-600 mb-2"/><h4 className="font-bold mb-2">Exportar</h4><button onClick={async()=>{const d=await S.export();const b=new Blob([d],{type:'application/json'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='ArteDental_'+new Date().toISOString().split('T')[0]+'.json';a.click()}} className="w-full bg-brand-600 text-white py-3 rounded-xl font-bold text-sm">Descargar</button></div>
            <div className="bg-white p-6 rounded-xl border text-center"><Upload size={32} className="mx-auto text-emerald-600 mb-2"/><h4 className="font-bold mb-2">Importar</h4><input type="file" ref={fileRef} accept=".json" className="hidden" onChange={async e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=async ev=>{if(await S.import(ev.target.result)){alert('Importado');window.location.reload()}else alert('Error')};r.readAsText(f)}}/><button onClick={()=>fileRef.current.click()} className="w-full bg-emerald-600 text-white py-3 rounded-xl font-bold text-sm">Cargar</button></div>
        </div>}

        {tab==='info'&&<div className="bg-gradient-to-br from-indigo-500 to-purple-600 p-6 rounded-xl text-white text-center"><Cloud size={40} className="mx-auto mb-2"/><h4 className="text-lg font-bold mb-2">Sistema en la Nube</h4><p className="text-white/80 text-sm mb-3">Supabase Database</p><div className={`inline-flex items-center gap-2 px-4 py-2 rounded-full ${online?'bg-emerald-500':'bg-red-500'}`}>{online?<><Wifi size={16}/>Conectado</>:<><WifiOff size={16}/>Offline</>}</div></div>}
    </div>
};

const App=()=>{
    const[user,setUser]=useState(null);const[tab,setTab]=useState('agenda');const[pid,setPid]=useState(null);
    const[loading,setLoading]=useState(true);const[online,setOnline]=useState(false);const[showPass,setShowPass]=useState(false);const[menuOpen,setMenuOpen]=useState(false);

    useEffect(()=>{S.init().then(ok=>{setOnline(ok);setLoading(false)});const i=setInterval(async()=>setOnline(await DB.check()),30000);return()=>clearInterval(i)},[]);
    const logout=async()=>{await DB.check();setUser(null)};

    if(loading)return<div className="min-h-screen flex flex-col items-center justify-center bg-gradient-to-br from-brand-600 to-indigo-900 text-white safe-top safe-bottom"><RefreshCw className="animate-spin mb-3" size={40}/><p className="font-bold">Conectando...</p></div>;
    if(!user)return<Login onLogin={setUser} online={online}/>;

    const tabs=[{id:'agenda',label:'Agenda',icon:Calendar},{id:'pacientes',label:'Pacientes',icon:Users},{id:'ficha',label:'Ficha',icon:FileHeart},{id:'historia',label:'Historia',icon:FileText},{id:'admin',label:'Sistema',icon:Shield}];

    return<div className="min-h-screen flex flex-col bg-slate-50">
        {showPass&&<div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4"><div className="bg-white w-full max-w-xs rounded-xl p-5"><h3 className="font-bold text-brand-600 mb-3">Cambiar Contraseña</h3><input id="np" type="password" placeholder="Nueva contraseña" className="w-full p-2.5 border rounded-lg mb-3"/><div className="flex gap-2"><button onClick={async()=>{const np=document.getElementById('np').value;if(np.length<3)return alert('Muy corta');await S.saveUser({...user,password:np});setUser({...user,password:np});setShowPass(false);alert('OK')}} className="flex-1 bg-brand-600 text-white py-2 rounded-lg font-bold text-sm">Guardar</button><button onClick={()=>setShowPass(false)} className="flex-1 bg-gray-200 text-gray-600 py-2 rounded-lg font-bold text-sm">Cancelar</button></div></div></div>}
        
        <header className="bg-brand-600 text-white p-3 safe-top no-print">
            <div className="flex justify-between items-center">
                <div className="flex items-center gap-2"><span className="text-xl">🦷</span><span className="font-bold">Arte Dental</span></div>
                <div className="flex items-center gap-2">
                    <Status on={online}/>
                    <button onClick={()=>setShowPass(true)} className="p-2 bg-brand-700 rounded-lg"><Key size={16}/></button>
                    <button onClick={logout} className="p-2 bg-brand-700 rounded-lg"><LogOut size={16}/></button>
                </div>
            </div>
        </header>

        <nav className="bg-white border-b px-2 py-1 flex gap-1 overflow-x-auto scrollbar-hide no-print">
            {tabs.map(t=><button key={t.id} onClick={()=>{setTab(t.id);setPid(null)}} className={`flex items-center gap-1.5 px-3 py-2 rounded-lg text-xs font-bold whitespace-nowrap ${tab===t.id?'bg-brand-100 text-brand-600':'text-gray-500'}`}><t.icon size={14}/>{t.label}</button>)}
        </nav>

        <main className="flex-1 p-3 overflow-auto safe-bottom">
            {tab==='agenda'&&<Agenda user={user}/>}
            {tab==='pacientes'&&<Patients user={user} onHist={id=>{setPid(id);setTab('historia')}} onMed={id=>{setPid(id);setTab('ficha')}}/>}
            {tab==='ficha'&&<Medical user={user} initId={pid}/>}
            {tab==='historia'&&<History user={user} initId={pid}/>}
            {tab==='admin'&&<Admin user={user} online={online}/>}
        </main>

        <footer className="p-2 text-center text-[10px] text-gray-400 no-print safe-bottom">Arte Dental © 2025 • {online?'🟢':'🔴'}</footer>
    </div>
};

createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
