import React,{useState,useEffect,useRef,useMemo} from 'react';

const SUPABASE_URL='https://gffhlahrjwiojdewvxws.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdmZmhsYWhyandpb2pkZXd2eHdzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY5NDA2ODYsImV4cCI6MjA4MjUxNjY4Nn0.yUdUDPYU63-70l-a2b3fqxDfb_GkX6hUveHRwaYcadc';
const supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const Role={ADMIN:'admin',ODONTOLOGO:'odontologo',USUARIO:'usuario'};

// ===== TOASTS =====
const tLabels={users:'usuarios',patients:'pacientes',appointments:'citas',history:'historial',images:'imágenes',medical_records:'ficha médica'};
const toastListeners=new Set();let toastId=0;
const toast={
    _emit:(type,msg,ms)=>{const id=++toastId;const item={id,type,msg,ms:ms||(type==='err'?5000:3500)};toastListeners.forEach(l=>l(item));return id},
    err:(msg,ms)=>toast._emit('err',msg,ms),
    ok:(msg,ms)=>toast._emit('ok',msg,ms),
    warn:(msg,ms)=>toast._emit('warn',msg,ms)
};
const dbErr=(op,t,e)=>{console.error(op,t,e);const detail=e?.message||e?.hint||'sin conexión';toast.err(`Error al ${op} ${tLabels[t]||t}: ${detail}`)};

// ===== THEME =====
const useTheme=()=>{
    const[dark,setDark]=useState(()=>document.documentElement.classList.contains('dark'));
    const toggle=()=>{const next=!dark;setDark(next);document.documentElement.classList.toggle('dark',next);try{localStorage.setItem('artedental_theme',next?'dark':'light')}catch(e){}};
    return[dark,toggle];
};

// ===== DB layer =====
const DB={
    online:false,
    check:async()=>{try{const{error}=await supabase.from('users').select('id').limit(1);DB.online=!error;return DB.online}catch{DB.online=false;return false}},
    getAll:async(t,opts={})=>{try{let q=supabase.from(t).select('*');if(opts.notDeleted)q=q.or('deleted.is.null,deleted.eq.false');if(opts.eq)for(const[k,v]of Object.entries(opts.eq))q=q.eq(k,v);q=opts.orderBy?q.order(opts.orderBy,{ascending:opts.asc!==false}):q.order('id');const{data,error}=await q;if(error)throw error;return data||[]}catch(e){dbErr('cargar',t,e);return[]}},
    insert:async(t,r)=>{try{const{data,error}=await supabase.from(t).insert(r).select().single();if(error)throw error;return data}catch(e){dbErr('guardar',t,e);return null}},
    update:async(t,id,r)=>{try{const{data,error}=await supabase.from(t).update(r).eq('id',id).select().single();if(error)throw error;return data}catch(e){dbErr('actualizar',t,e);return null}},
    delete:async(t,id)=>{try{const{error}=await supabase.from(t).delete().eq('id',id);if(error)throw error;return true}catch(e){dbErr('eliminar',t,e);return false}}
};

// ===== Service layer =====
const S={
    init:async()=>await DB.check(),
    getCurrentUser:async()=>{
        const{data:{session}}=await supabase.auth.getSession();
        if(!session)return null;
        const{data,error}=await supabase.from('users').select('*').eq('email',session.user.email).maybeSingle();
        if(error||!data)return null;
        return data;
    },
    getUsers:()=>DB.getAll('users',{orderBy:'id'}),
    updateUserMeta:async u=>DB.update('users',u.id,{name:u.name,username:(u.username||'').toLowerCase(),role:u.role}),
    createUser:async({email,password,name,username,role})=>{
        email=(email||'').trim().toLowerCase();
        username=(username||'').trim().toLowerCase();
        if(!email||!password||!name||!username)return{ok:false,err:'Faltan campos'};
        if(password.length<6)return{ok:false,err:'Contraseña mínima 6 caracteres'};
        try{
            const{data:sess}=await supabase.auth.getSession();
            const adminSession=sess?.session;
            const{data,error}=await supabase.auth.signUp({email,password});
            if(error)throw error;
            if(adminSession){await supabase.auth.setSession({access_token:adminSession.access_token,refresh_token:adminSession.refresh_token})}
            const row=await DB.insert('users',{email,username,name,role,auth_id:data.user?.id});
            if(!row)return{ok:false,err:'Usuario creado en Auth pero falló el guardado de metadatos'};
            return{ok:true,user:row};
        }catch(e){return{ok:false,err:e.message||'Error al crear usuario'}}
    },
    delUser:id=>DB.delete('users',id),
    changeOwnPassword:async np=>{
        if(np.length<6)return{ok:false,err:'Mínimo 6 caracteres'};
        const{error}=await supabase.auth.updateUser({password:np});
        if(error)return{ok:false,err:error.message};
        return{ok:true};
    },
    getPatients:()=>DB.getAll('patients',{notDeleted:true}),
    getPatient:async id=>{const{data}=await supabase.from('patients').select('*').eq('id',id).maybeSingle();return data},
    savePatient:async p=>p.id?DB.update('patients',p.id,p):DB.insert('patients',p),
    delPatient:id=>DB.update('patients',id,{deleted:true}),
    getApps:()=>DB.getAll('appointments',{notDeleted:true}),
    getAppsByPatient:pid=>DB.getAll('appointments',{notDeleted:true,eq:{paciente_id:pid}}),
    saveApp:async a=>a.id?DB.update('appointments',a.id,a):DB.insert('appointments',a),
    delApp:id=>DB.update('appointments',id,{deleted:true}),
    getHist:async pid=>DB.getAll('history',{notDeleted:true,eq:{paciente_id:pid},orderBy:'id',asc:false}),
    saveHist:h=>DB.insert('history',h),
    getImgs:async pid=>DB.getAll('images',{notDeleted:true,eq:{paciente_id:pid}}),
    saveImg:i=>DB.insert('images',i),
    delImg:id=>DB.update('images',id,{deleted:true}),
    getMed:async pid=>{const{data}=await supabase.from('medical_records').select('*').eq('paciente_id',pid).maybeSingle();return data},
    saveMed:async r=>{const ex=await S.getMed(r.paciente_id);return ex?DB.update('medical_records',ex.id,r):DB.insert('medical_records',r)},
    hasCond:async pid=>{const r=await S.getMed(pid);if(!r)return false;return(r.alergias?.length>0)||(r.alergias_medicamentos?.length>0)||(r.medicacion_actual?.length>0)||Object.entries(r.antecedentes_personales||{}).some(([k,v])=>k!=='otros'&&v===true)},
    export:async()=>JSON.stringify({patients:await DB.getAll('patients'),appointments:await DB.getAll('appointments'),history:await DB.getAll('history'),images:await DB.getAll('images'),medical_records:await DB.getAll('medical_records')},null,2),
    import:async json=>{
        try{
            const d=JSON.parse(json);
            const allowed=['patients','appointments','history','images','medical_records'];
            const keys=Object.keys(d);
            if(keys.some(k=>!allowed.includes(k))){toast.err('Backup inválido: contiene tablas no permitidas');return false}
            for(const t of keys)for(const r of d[t])await supabase.from(t).upsert(r);
            return true;
        }catch{return false}
    }
};

const isPast=(d,t)=>d&&t?new Date(d+'T'+t)<new Date():false;
const compress=file=>new Promise(res=>{const r=new FileReader();r.readAsDataURL(file);r.onload=e=>{const img=new Image();img.src=e.target.result;img.onload=()=>{const c=document.createElement('canvas');let w=img.width,h=img.height;const M=800;if(w>h&&w>M){h*=M/w;w=M}else if(h>M){w*=M/h;h=M}c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);res(c.toDataURL('image/jpeg',0.6))}}});
const formatCI=ci=>{if(!ci)return '';const nums=String(ci).replace(/\D/g,'');if(nums.length<=1)return nums;if(nums.length<=4)return nums.replace(/(\d{1})(\d{1,3})/,'$1.$2');if(nums.length<=7)return nums.replace(/(\d{1})(\d{3})(\d{1,3})/,'$1.$2.$3');return nums.replace(/(\d{1})(\d{3})(\d{3})(\d{1})/,'$1.$2.$3-$4').substring(0,12)};

// ===== UI ATOMS =====
const Status=({on})=><div className={`flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[10px] font-bold ${on?'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-300':'bg-red-100 text-red-700 dark:bg-red-900/40 dark:text-red-300'}`}>{on?<><Wifi size={12}/>Online</>:<><WifiOff size={12}/>Offline</>}</div>;
const Modal=({src,onClose})=><div className="fixed inset-0 bg-black/90 flex items-center justify-center z-50 p-4" onClick={onClose}><img src={src} className="max-w-full max-h-full rounded-lg"/></div>;
const Card=({children,className=''})=><div className={`bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl ${className}`}>{children}</div>;
const SectionTitle=({icon:Icon,children,color='text-brand-600 dark:text-brand-400'})=><h3 className={`font-bold text-xs uppercase mb-3 flex items-center gap-2 ${color}`}>{Icon&&<Icon size={14}/>}{children}</h3>;
const Input=props=><input {...props} className={`w-full p-2.5 border border-slate-300 dark:border-slate-600 rounded-lg text-sm font-medium bg-white dark:bg-slate-700 ${props.className||''}`}/>;
const Select=({children,...props})=><select {...props} className={`w-full p-2.5 border border-slate-300 dark:border-slate-600 rounded-lg text-sm font-medium bg-white dark:bg-slate-700 ${props.className||''}`}>{children}</select>;
const Textarea=props=><textarea {...props} className={`w-full p-2.5 border border-slate-300 dark:border-slate-600 rounded-lg text-sm bg-white dark:bg-slate-700 ${props.className||''}`}/>;
const Btn=({children,variant='primary',className='',...props})=>{const v={primary:'bg-brand-600 hover:bg-brand-700 text-white',secondary:'bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200 hover:bg-slate-300 dark:hover:bg-slate-600',danger:'bg-red-600 hover:bg-red-700 text-white',success:'bg-emerald-600 hover:bg-emerald-700 text-white',ghost:'bg-transparent hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300'}[variant];return<button {...props} className={`${v} font-bold rounded-xl transition-colors disabled:opacity-50 ${className}`}>{children}</button>};

const Toasts=()=>{
    const[items,setItems]=useState([]);
    useEffect(()=>{const l=t=>{setItems(x=>[...x,t]);setTimeout(()=>setItems(x=>x.filter(i=>i.id!==t.id)),t.ms)};toastListeners.add(l);return()=>toastListeners.delete(l)},[]);
    const close=id=>setItems(x=>x.filter(i=>i.id!==id));
    const cfg={err:{bg:'bg-red-600',Icon:XCircle},ok:{bg:'bg-emerald-600',Icon:CheckCircle2},warn:{bg:'bg-amber-500',Icon:AlertTriangle}};
    return<div className="fixed top-3 right-3 left-3 sm:left-auto z-[100] space-y-2 pointer-events-none safe-top sm:max-w-sm">
        {items.map(t=>{const{bg,Icon}=cfg[t.type];return<div key={t.id} className={`${bg} text-white px-3 py-2.5 rounded-xl shadow-lg flex items-center gap-2 text-sm font-medium pointer-events-auto animate-fade-in`}><Icon size={18} className="shrink-0"/><span className="flex-1 break-words">{t.msg}</span><button onClick={()=>close(t.id)} className="text-white/80 hover:text-white shrink-0"><X size={14}/></button></div>})}
    </div>
};

// ===== LOGIN =====
const Login=({onLogin,online})=>{
    const[u,setU]=useState('');const[p,setP]=useState('');const[err,setErr]=useState('');const[loading,setLoading]=useState(false);
    const submit=async e=>{
        e.preventDefault();
        if(!u||!p)return setErr('Complete todos los campos');
        setLoading(true);setErr('');
        const username=u.trim().toLowerCase();
        const email=username.includes('@')?username:`${username}@local.com`;
        try{
            const{error}=await supabase.auth.signInWithPassword({email,password:p});
            if(error)throw error;
            const user=await S.getCurrentUser();
            if(!user){await supabase.auth.signOut();setErr('Usuario autenticado pero sin perfil');return}
            onLogin(user);
        }catch(e){setErr('Credenciales incorrectas')}
        finally{setLoading(false)}
    };
    return<div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-800 to-indigo-900 p-4 safe-top safe-bottom"><div className="w-full max-w-sm bg-white dark:bg-slate-800 rounded-2xl shadow-2xl p-6 text-center"><Cloud size={40} className="mx-auto text-brand-600 dark:text-brand-400 mb-2"/><h1 className="text-2xl font-bold text-slate-800 dark:text-slate-100 mb-1">🦷 Arte Dental</h1><p className="text-[10px] text-slate-400 mb-2">Sistema en la Nube</p><div className="mb-4 flex justify-center"><Status on={online}/></div><form onSubmit={submit} className="space-y-3"><Input type="text" value={u} onChange={e=>setU(e.target.value)} placeholder="Usuario" autoComplete="username" autoCapitalize="none" spellCheck="false"/><Input type="password" value={p} onChange={e=>setP(e.target.value)} placeholder="Contraseña" autoComplete="current-password"/>{err&&<p className="text-red-500 text-xs font-medium">{err}</p>}<Btn type="submit" disabled={loading||!online} className="w-full py-3">{loading?'Conectando...':online?'Ingresar':'Sin conexión'}</Btn></form></div></div>
};

// ===== DASHBOARD =====
const Dashboard=({user,onOpenPatient})=>{
    const[stats,setStats]=useState(null);const[upcoming,setUpcoming]=useState([]);
    useEffect(()=>{(async()=>{
        const[pts,apps,hist]=await Promise.all([S.getPatients(),S.getApps(),DB.getAll('history',{notDeleted:true})]);
        const today=new Date().toISOString().split('T')[0];
        const past=apps.filter(a=>isPast(a.fecha,a.hora));
        const pastDecidido=past.filter(a=>a.asistio===true||a.asistio===false);
        const asistidas=past.filter(a=>a.asistio===true).length;
        const cobrado=hist.filter(h=>h.tipo==='PAGO').reduce((s,h)=>{const m=/\$(\d+)/.exec(h.motivo||'');return s+(m?parseInt(m[1]):0)},0);
        setStats({
            totalPacientes:pts.length,
            citasHoy:apps.filter(a=>a.fecha===today&&!isPast(a.fecha,a.hora)).length,
            citasProximas:apps.filter(a=>!isPast(a.fecha,a.hora)).length,
            asistenciaPct:pastDecidido.length?Math.round((asistidas/pastDecidido.length)*100):null,
            saldoPendiente:pts.reduce((s,p)=>s+Math.max(0,(p.presupuesto||0)-(p.abonado||0)),0),
            cobrado
        });
        setUpcoming(apps.filter(a=>!isPast(a.fecha,a.hora)).sort((a,b)=>new Date(a.fecha+'T'+a.hora)-new Date(b.fecha+'T'+b.hora)).slice(0,5));
    })()},[]);

    if(!stats)return<div className="p-8 text-center text-slate-400"><RefreshCw className="animate-spin mx-auto mb-2" size={24}/>Cargando...</div>;
    const StatCard=({label,value,icon:Icon,color,sub})=><Card className="p-4"><div className="flex justify-between items-start"><div><p className="text-[10px] font-bold text-slate-400 uppercase">{label}</p><p className={`text-2xl font-bold ${color}`}>{value}</p>{sub&&<p className="text-[10px] text-slate-400">{sub}</p>}</div><Icon size={20} className={color}/></div></Card>;

    return<div className="space-y-4 animate-fade-in">
        <div className="bg-gradient-to-br from-slate-800 to-indigo-900 p-4 rounded-xl text-white"><h2 className="text-lg font-bold">Hola, {user.name} 👋</h2><p className="text-[11px] text-white/70">{new Date().toLocaleDateString('es-UY',{weekday:'long',day:'numeric',month:'long'})}</p></div>
        <div className="grid grid-cols-2 gap-3">
            <StatCard label="Pacientes" value={stats.totalPacientes} icon={Users} color="text-brand-600 dark:text-brand-400"/>
            <StatCard label="Citas hoy" value={stats.citasHoy} icon={Calendar} color="text-emerald-600 dark:text-emerald-400"/>
            <StatCard label="Próximas" value={stats.citasProximas} icon={Clock} color="text-amber-600 dark:text-amber-400"/>
            <StatCard label="Asistencia" value={stats.asistenciaPct===null?'—':stats.asistenciaPct+'%'} icon={TrendingUp} color="text-indigo-600 dark:text-indigo-400" sub="citas pasadas"/>
            <StatCard label="Saldo pendiente" value={'$'+stats.saldoPendiente.toLocaleString('es-UY')} icon={DollarSign} color="text-red-600 dark:text-red-400"/>
            <StatCard label="Cobrado" value={'$'+stats.cobrado.toLocaleString('es-UY')} icon={Activity} color="text-slate-600 dark:text-slate-300" sub="histórico"/>
        </div>
        {upcoming.length>0&&<Card className="overflow-hidden">
            <div className="p-3 border-b border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900/50"><h3 className="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase">Próximas citas</h3></div>
            <div className="divide-y divide-slate-200 dark:divide-slate-700">{upcoming.map(a=><button key={a.id} onClick={()=>onOpenPatient(a.paciente_id)} className="w-full p-3 flex justify-between items-center hover:bg-slate-50 dark:hover:bg-slate-700/50 text-left"><div><p className="font-bold text-sm">{a.paciente_nombre}</p><p className="text-[10px] text-slate-400">Dr. {a.odontologo}</p></div><div className="text-right"><p className="text-xs font-bold text-brand-600 dark:text-brand-400">{a.fecha}</p><p className="text-[10px] text-slate-400">{a.hora}</p></div></button>)}</div>
        </Card>}
    </div>
};

// ===== AGENDA =====
const Agenda=({user,onOpenPatient})=>{
    const[apps,setApps]=useState([]);const[pts,setPts]=useState([]);const[users,setUsers]=useState([]);
    const[search,setSearch]=useState('');const[showList,setShowList]=useState(false);const[tab,setTab]=useState('prox');
    const[form,setForm]=useState({pid:'',dr:'',date:new Date().toISOString().split('T')[0],time:'',tto:''});
    const[cond,setCond]=useState({});const[saving,setSaving]=useState(false);

    useEffect(()=>{load()},[]);
    const load=async()=>{const[a,p,u]=await Promise.all([S.getApps(),S.getPatients(),S.getUsers()]);setApps(a);setPts(p);setUsers(u);const c={};for(const pt of p)c[pt.id]=await S.hasCond(pt.id);setCond(c)};

    const submit=async()=>{
        if(!form.pid||!form.dr||!form.time||!form.date)return toast.warn('Complete todos los campos');
        if(new Date(form.date+'T'+form.time)<new Date())return toast.warn('La fecha/hora ya pasó');
        if(apps.find(a=>a.odontologo===form.dr&&a.fecha===form.date&&a.hora===form.time))return toast.warn('Horario ocupado');
        const p=pts.find(x=>x.id===form.pid);
        if(!p)return toast.warn('Seleccione paciente');
        setSaving(true);
        const result=await S.saveApp({paciente_id:p.id,paciente_nombre:p.nombre,paciente_ci:p.ci,odontologo:form.dr,fecha:form.date,hora:form.time,tratamiento:form.tto||'',asistio:null,deleted:false});
        if(result){
            await S.saveHist({paciente_id:p.id,fecha:new Date().toLocaleDateString(),odontologo:form.dr,motivo:'CITA AGENDADA: '+form.date+' '+form.time,tipo:'CITA',deleted:false});
            setForm({pid:'',dr:'',date:new Date().toISOString().split('T')[0],time:'',tto:''});setSearch('');
            await load();toast.ok('Cita agendada');
        }
        setSaving(false);
    };

    const toggle=async(id,val)=>{const a=apps.find(x=>x.id===id);if(a){await S.saveApp({...a,asistio:val});load()}};
    const list=tab==='prox'?apps.filter(a=>!isPast(a.fecha,a.hora)).sort((a,b)=>new Date(a.fecha+'T'+a.hora)-new Date(b.fecha+'T'+b.hora)):apps.filter(a=>isPast(a.fecha,a.hora)).sort((a,b)=>new Date(b.fecha+'T'+b.hora)-new Date(a.fecha+'T'+a.hora));

    return<div className="space-y-4 animate-fade-in">
        <Card className="p-4">
            <SectionTitle icon={Calendar}>Agendar Cita</SectionTitle>
            <div className="space-y-3">
                <div className="relative">
                    <Input type="text" placeholder="Buscar paciente..." value={search} onChange={e=>{setSearch(e.target.value);setShowList(true)}}/>
                    {showList&&search&&<div className="absolute z-20 w-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg shadow-lg max-h-40 overflow-auto">{pts.filter(p=>(p.nombre||'').toLowerCase().includes(search.toLowerCase())).map(p=><div key={p.id} onClick={()=>{setForm({...form,pid:p.id});setSearch(p.nombre);setShowList(false)}} className={`p-2.5 text-sm font-medium border-b border-slate-200 dark:border-slate-700 cursor-pointer active:bg-brand-100 dark:active:bg-brand-900/30 ${cond[p.id]?'bg-pink-50 dark:bg-pink-900/20':''}`}>{p.nombre}{cond[p.id]&&<span className="ml-2 bg-pink-500 text-white text-[8px] px-1.5 py-0.5 rounded-full">⚠️</span>}</div>)}</div>}
                </div>
                <Select value={form.dr} onChange={e=>setForm({...form,dr:e.target.value})}><option value="">Profesional...</option>{users.filter(u=>u.role===Role.ODONTOLOGO).map(o=><option key={o.id} value={o.name}>{o.name}</option>)}</Select>
                <div className="grid grid-cols-2 gap-2"><Input type="date" value={form.date} min={new Date().toISOString().split('T')[0]} onChange={e=>setForm({...form,date:e.target.value})}/><Input type="time" value={form.time} onChange={e=>setForm({...form,time:e.target.value})}/></div>
                <Textarea value={form.tto} onChange={e=>setForm({...form,tto:e.target.value})} placeholder="Descripción..." className="h-16 resize-none"/>
                <Btn onClick={submit} disabled={saving} className="w-full py-3 text-sm">{saving?'Guardando...':'Confirmar Cita'}</Btn>
            </div>
        </Card>
        <Card className="overflow-hidden">
            <div className="flex border-b border-slate-200 dark:border-slate-700"><button onClick={()=>setTab('prox')} className={`flex-1 py-3 text-xs font-bold ${tab==='prox'?'bg-brand-50 dark:bg-brand-900/20 text-brand-600 dark:text-brand-400 border-b-2 border-brand-600':'text-slate-400'}`}>Próximos</button><button onClick={()=>setTab('past')} className={`flex-1 py-3 text-xs font-bold ${tab==='past'?'bg-brand-50 dark:bg-brand-900/20 text-brand-600 dark:text-brand-400 border-b-2 border-brand-600':'text-slate-400'}`}>Pasados</button></div>
            <div className="divide-y divide-slate-200 dark:divide-slate-700 max-h-[50vh] overflow-auto">
                {list.map(a=><div key={a.id} className={`p-3 ${cond[a.paciente_id]?'bg-pink-50 dark:bg-pink-900/10 border-l-4 border-pink-500':''}`}>
                    <div className="flex justify-between items-start gap-2">
                        <button onClick={()=>onOpenPatient(a.paciente_id)} className="text-left flex-1 min-w-0"><p className="font-bold text-sm truncate">{a.paciente_nombre}{cond[a.paciente_id]&&<HeartPulse size={14} className="text-pink-500 inline ml-1"/>}</p><p className="text-xs text-slate-500 dark:text-slate-400">{a.fecha} {a.hora} • Dr. {a.odontologo}</p></button>
                        <div className="flex gap-1 shrink-0"><button onClick={()=>toggle(a.id,true)} className={`p-1.5 rounded ${a.asistio===true?'bg-emerald-600 text-white':'bg-slate-100 dark:bg-slate-700 text-slate-400'}`}><UserCheck size={14}/></button><button onClick={()=>toggle(a.id,false)} className={`p-1.5 rounded ${a.asistio===false?'bg-red-600 text-white':'bg-slate-100 dark:bg-slate-700 text-slate-400'}`}><UserX size={14}/></button><button onClick={async()=>{if(confirm('¿Eliminar?')){await S.delApp(a.id);load()}}} className="p-1.5 text-red-400"><Trash2 size={14}/></button></div>
                    </div>
                </div>)}
                {list.length===0&&<div className="p-8 text-center text-slate-300 dark:text-slate-600 text-xs font-bold">Sin citas</div>}
            </div>
        </Card>
    </div>
};

// ===== ODONTOGRAMA =====
const TOOTH_STATES={
    sano:{color:'#ffffff',border:'#94a3b8',label:'Sano',dark:false},
    caries:{color:'#ef4444',border:'#b91c1c',label:'Caries',dark:true},
    restaurado:{color:'#3b82f6',border:'#1e40af',label:'Restaurado',dark:true},
    endodoncia:{color:'#f59e0b',border:'#b45309',label:'Endodoncia',dark:true},
    corona:{color:'#fbbf24',border:'#a16207',label:'Corona',dark:true},
    implante:{color:'#10b981',border:'#047857',label:'Implante',dark:true},
    extraccion:{color:'#6b7280',border:'#374151',label:'A extraer',dark:true},
    ausente:{color:'#1f2937',border:'#000',label:'Ausente',dark:true}
};
const UPPER=[18,17,16,15,14,13,12,11,21,22,23,24,25,26,27,28];
const LOWER=[48,47,46,45,44,43,42,41,31,32,33,34,35,36,37,38];

const Odontogram=({value,onChange,onSave})=>{
    const[sel,setSel]=useState(null);
    const getState=n=>value?.[n]||'sano';
    const setState=(n,s)=>{onChange({...(value||{}),[n]:s});setSel(null)};
    const Tooth=({n})=>{const st=TOOTH_STATES[getState(n)];return<div className="flex flex-col items-center gap-0.5"><span className="text-[8px] text-slate-400 font-bold">{n}</span><div className="tooth w-7 h-9 rounded-md flex items-center justify-center text-[9px] font-bold" style={{background:st.color,border:`2px solid ${st.border}`,color:st.dark?'#fff':'#64748b'}} onClick={()=>setSel(n)}>🦷</div></div>};

    return<Card className="p-4">
        <div className="flex justify-between items-center mb-3"><SectionTitle>Odontograma (FDI)</SectionTitle><Btn onClick={onSave} className="text-xs px-3 py-1">Guardar</Btn></div>
        <div className="overflow-x-auto">
            <div className="min-w-[520px] space-y-2">
                <div className="flex justify-center gap-1">{UPPER.map(n=><Tooth key={n} n={n}/>)}</div>
                <div className="border-t border-dashed border-slate-300 dark:border-slate-600 my-1"/>
                <div className="flex justify-center gap-1">{LOWER.map(n=><Tooth key={n} n={n}/>)}</div>
            </div>
        </div>
        <div className="mt-3 grid grid-cols-4 gap-1 text-[9px]">{Object.entries(TOOTH_STATES).map(([k,v])=><div key={k} className="flex items-center gap-1"><div className="w-3 h-3 rounded" style={{background:v.color,border:`1px solid ${v.border}`}}/><span>{v.label}</span></div>)}</div>
        {sel&&<div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4" onClick={()=>setSel(null)}><div className="bg-white dark:bg-slate-800 rounded-xl p-4 max-w-xs w-full" onClick={e=>e.stopPropagation()}><h4 className="font-bold text-sm mb-2">Pieza {sel}</h4><div className="grid grid-cols-2 gap-2">{Object.entries(TOOTH_STATES).map(([k,v])=><button key={k} onClick={()=>setState(sel,k)} className="p-2 rounded-lg border-2 text-xs font-bold" style={{background:v.color,borderColor:v.border,color:v.dark?'#fff':'#1f2937'}}>{v.label}</button>)}</div></div></div>}
    </Card>
};

// ===== HUB DE PACIENTE (centralizado) =====
const PatientHub=({user,patientId,onBack})=>{
    const[patient,setPatient]=useState(null);
    const[tab,setTab]=useState('resumen');
    const[medRec,setMedRec]=useState(null);
    const[hist,setHist]=useState([]);
    const[imgs,setImgs]=useState([]);
    const[apps,setApps]=useState([]);
    const[users,setUsers]=useState([]);
    const[loading,setLoading]=useState(true);

    useEffect(()=>{loadAll()},[patientId]);
    const loadAll=async()=>{
        setLoading(true);
        const[p,m,h,i,a,u]=await Promise.all([
            S.getPatient(patientId),
            S.getMed(patientId),
            S.getHist(patientId),
            S.getImgs(patientId),
            S.getAppsByPatient(patientId),
            S.getUsers()
        ]);
        setPatient(p);setMedRec(m);setHist(h);setImgs(i);setApps(a);setUsers(u.filter(x=>x.role===Role.ODONTOLOGO));
        setLoading(false);
    };

    if(loading)return<div className="p-8 text-center text-slate-400"><RefreshCw className="animate-spin mx-auto mb-2" size={24}/>Cargando paciente...</div>;
    if(!patient)return<div className="p-8 text-center"><p className="text-red-500">Paciente no encontrado</p><Btn onClick={onBack} variant="secondary" className="mt-3 px-4 py-2 text-sm">Volver</Btn></div>;

    const tabs=[
        {id:'resumen',label:'Resumen',icon:UserIcon},
        {id:'ficha',label:'Ficha',icon:FileHeart},
        {id:'odo',label:'Odontograma',icon:Activity},
        {id:'historia',label:'Historia',icon:FileText},
        {id:'fotos',label:'Fotos',icon:ImageIcon},
        {id:'citas',label:'Citas',icon:Calendar}
    ];

    const hasAlerts=medRec&&(medRec.alergias?.length>0||medRec.alergias_medicamentos?.length>0);
    const saldo=Math.max(0,(patient.presupuesto||0)-(patient.abonado||0));

    return<div className="space-y-4 animate-fade-in">
        {/* Header del paciente */}
        <Card className="p-4">
            <div className="flex items-start gap-3">
                <Btn onClick={onBack} variant="ghost" className="p-2"><ChevronLeft size={18}/></Btn>
                <div className="flex-1 min-w-0">
                    <h2 className="font-bold text-lg truncate">{patient.nombre}</h2>
                    <p className="text-xs text-slate-500 dark:text-slate-400">CI: {formatCI(patient.ci)} {patient.telefono&&`• ${patient.telefono}`}</p>
                </div>
            </div>
            {hasAlerts&&<div className="mt-3 bg-red-500 text-white p-2 rounded-lg flex items-center gap-2 text-xs font-medium"><AlertTriangle size={14}/><span className="truncate">Alergias: {[...(medRec.alergias||[]),...(medRec.alergias_medicamentos||[])].join(', ')}</span></div>}
        </Card>

        {/* Sub-tabs */}
        <div className="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl overflow-hidden">
            <div className="flex overflow-x-auto scrollbar-hide">
                {tabs.map(t=><button key={t.id} onClick={()=>setTab(t.id)} className={`flex items-center gap-1.5 px-4 py-3 text-xs font-bold whitespace-nowrap border-b-2 ${tab===t.id?'border-brand-600 text-brand-600 dark:text-brand-400 bg-brand-50/50 dark:bg-brand-900/20':'border-transparent text-slate-400'}`}><t.icon size={14}/>{t.label}</button>)}
            </div>
        </div>

        {tab==='resumen'&&<PatientResumen patient={patient} medRec={medRec} hist={hist} apps={apps} saldo={saldo} onGoTab={setTab}/>}
        {tab==='ficha'&&<PatientFicha patient={patient} medRec={medRec} user={user} onSaved={loadAll}/>}
        {tab==='odo'&&<PatientOdo patient={patient} medRec={medRec} user={user} onSaved={loadAll}/>}
        {tab==='historia'&&<PatientHistoria patient={patient} hist={hist} users={users} user={user} onReload={loadAll}/>}
        {tab==='fotos'&&<PatientFotos patient={patient} imgs={imgs} onReload={loadAll}/>}
        {tab==='citas'&&<PatientCitas patient={patient} apps={apps} onReload={loadAll}/>}
    </div>
};

// --- Sub-vistas del hub ---
const PatientResumen=({patient,medRec,hist,apps,saldo,onGoTab})=>{
    const proxCita=apps.filter(a=>!isPast(a.fecha,a.hora)).sort((a,b)=>new Date(a.fecha+'T'+a.hora)-new Date(b.fecha+'T'+b.hora))[0];
    const ultEvo=hist.find(h=>h.tipo==='EVOLUCION');
    return<div className="space-y-4">
        <Card className="p-4">
            <SectionTitle icon={DollarSign}>Finanzas</SectionTitle>
            <div className="grid grid-cols-3 gap-2 text-center p-3 bg-slate-900 dark:bg-slate-950 rounded-lg text-white">
                <div><span className="text-[10px] text-slate-400 block">Presup.</span><span className="font-bold text-brand-400">${(patient.presupuesto||0).toLocaleString('es-UY')}</span></div>
                <div><span className="text-[10px] text-slate-400 block">Abonado</span><span className="font-bold text-emerald-400">${(patient.abonado||0).toLocaleString('es-UY')}</span></div>
                <div><span className="text-[10px] text-slate-400 block">Saldo</span><span className="font-bold text-red-400">${saldo.toLocaleString('es-UY')}</span></div>
            </div>
        </Card>
        {proxCita&&<Card className="p-4 border-l-4 border-l-amber-500">
            <SectionTitle icon={Calendar} color="text-amber-600 dark:text-amber-400">Próxima cita</SectionTitle>
            <p className="text-sm font-bold">{proxCita.fecha} • {proxCita.hora}</p>
            <p className="text-xs text-slate-500 dark:text-slate-400">Dr. {proxCita.odontologo}</p>
            {proxCita.tratamiento&&<p className="text-xs mt-1">{proxCita.tratamiento}</p>}
        </Card>}
        {ultEvo&&<Card className="p-4 border-l-4 border-l-brand-500">
            <SectionTitle icon={ClipboardList}>Última evolución</SectionTitle>
            <p className="text-[10px] text-slate-400">{ultEvo.fecha} • Dr. {ultEvo.odontologo}</p>
            <p className="text-sm mt-1">{ultEvo.motivo}</p>

            {medRec.alergias?.length>0&&<p className="text-xs mb-1"><span className="font-bold text-red-600 dark:text-red-400">Alergias:</span> {medRec.alergias.join(', ')}</p>}
            {medRec.alergias_medicamentos?.length>0&&<p className="text-xs mb-1"><span className="font-bold text-orange-600 dark:text-orange-400">Alergias a medicamentos:</span> {medRec.alergias_medicamentos.join(', ')}</p>}
            {medRec.medicacion_actual?.length>0&&<p className="text-xs mb-1"><span className="font-bold text-emerald-600 dark:text-emerald-400">Medicación:</span> {medRec.medicacion_actual.map(m=>m.nombre+(m.dosis?` (${m.dosis})`:'')).join(', ')}</p>}
            {!medRec.alergias?.length&&!medRec.alergias_medicamentos?.length&&!medRec.medicacion_actual?.length&&<p className="text-xs text-slate-400">Sin datos médicos relevantes</p>}
        </Card>}
        <div className="grid grid-cols-2 gap-2">
            <Btn onClick={()=>onGoTab('historia')} variant="secondary" className="py-3 text-xs"><FileText size={14} className="inline mr-1"/>Historia</Btn>
            <Btn onClick={()=>onGoTab('ficha')} variant="secondary" className="py-3 text-xs"><FileHeart size={14} className="inline mr-1"/>Ficha</Btn>
        </div>
    </div>
};

const PatientOdo=({patient,medRec,user,onSaved})=>{
    const[rec,setRec]=useState(medRec||{paciente_id:patient.id,antecedentes_familiares:{},antecedentes_personales:{},alergias:[],alergias_medicamentos:[],medicacion_actual:[],odontograma:{}});

const PatientHistoria=({patient,hist,users,user,onReload})=>{
    const[form,setForm]=useState({tto:'',dr:user.role===Role.ODONTOLOGO?user.name:''});
    const[presForm,setPresForm]=useState({monto:'',motivo:''});const[pago,setPago]=useState('');
    const[filter,setFilter]=useState('TODO');
    const filtered=useMemo(()=>filter==='TODO'?hist:hist.filter(h=>h.tipo===filter),[hist,filter]);

    const saveEvo=async()=>{if(!form.tto||!form.dr)return toast.warn('Complete campos');const r=await S.saveHist({paciente_id:patient.id,fecha:new Date().toLocaleDateString(),odontologo:form.dr,motivo:form.tto,tipo:'EVOLUCION',deleted:false});if(r){setForm({tto:'',dr:user.role===Role.ODONTOLOGO?user.name:form.dr});toast.ok('Evolución guardada');onReload()}};

    const saveFin=async()=>{
        const addB=parseFloat(presForm.monto)||0;const addP=parseFloat(pago)||0;
        if(!addB&&!addP)return;
        let newB=patient.presupuesto||0;let newA=patient.abonado||0;
        if(addB>0){if(!presForm.motivo)return toast.warn('Indique motivo del presupuesto');newB+=addB;await S.saveHist({paciente_id:patient.id,fecha:new Date().toLocaleDateString(),odontologo:user.name,motivo:'PRESUPUESTO: $'+addB+' - '+presForm.motivo,tipo:'PRESUPUESTO',deleted:false})}
        if(addP>0){newA+=addP;await S.saveHist({paciente_id:patient.id,fecha:new Date().toLocaleDateString(),odontologo:user.name,motivo:'ABONO: $'+addP,tipo:'PAGO',deleted:false})}
        let saldado=false;
        if(newB>0&&newA>=newB){await S.saveHist({paciente_id:patient.id,fecha:new Date().toLocaleDateString(),odontologo:user.name,motivo:'CUENTA SALDADA',tipo:'SISTEMA',deleted:false});newB=0;newA=0;saldado=true}
        const r=await S.savePatient({...patient,presupuesto:newB,abonado:newA});if(r){setPresForm({monto:'',motivo:''});setPago('');onReload();toast.ok(saldado?'¡Cuenta saldada!':'Montos actualizados')}
    };

    const FILTERS=[['TODO','Todo'],['EVOLUCION','Evoluciones'],['PAGO','Pagos'],['PRESUPUESTO','Presup.'],['CITA','Citas'],['SISTEMA','Sistema']];

    return<div className="space-y-4">
        <Card className="p-4">
            <SectionTitle icon={DollarSign}>Movimiento financiero</SectionTitle>
            <div className="space-y-2">
                <Input placeholder="Motivo presupuesto" value={presForm.motivo} onChange={e=>setPresForm({...presForm,motivo:e.target.value})}/>
                <div className="grid grid-cols-2 gap-2"><Input type="number" placeholder="Presupuesto $" value={presForm.monto} onChange={e=>setPresForm({...presForm,monto:e.target.value})}/><Input type="number" placeholder="Pago $" value={pago} onChange={e=>setPago(e.target.value)}/></div>
                <Btn onClick={saveFin} variant="secondary" className="w-full py-2 text-sm bg-slate-800 hover:bg-slate-700 text-white">Registrar</Btn>
            </div>
        </Card>
        <Card className="p-4">
            <SectionTitle icon={PlusCircle}>Nueva Evolución</SectionTitle>
            <Select value={form.dr} onChange={e=>setForm({...form,dr:e.target.value})} className="mb-2"><option value="">Odontólogo...</option>{users.map(u=><option key={u.id} value={u.name}>{u.name}</option>)}</Select>
            <Textarea value={form.tto} onChange={e=>setForm({...form,tto:e.target.value})} placeholder="Tratamiento..." className="h-20 resize-none mb-2"/>
            <Btn onClick={saveEvo} className="w-full py-2 text-sm">Guardar Evolución</Btn>
        </Card>
        <Card className="overflow-hidden">
            <div className="p-2 border-b border-slate-200 dark:border-slate-700 flex gap-1 overflow-x-auto scrollbar-hide">{FILTERS.map(([k,l])=><button key={k} onClick={()=>setFilter(k)} className={`px-2.5 py-1 rounded-full text-[10px] font-bold whitespace-nowrap ${filter===k?'bg-brand-600 text-white':'bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-400'}`}>{l}</button>)}</div>
            <div className="divide-y divide-slate-200 dark:divide-slate-700 max-h-[50vh] overflow-auto">
                {filtered.map(h=><div key={h.id} className={`p-3 border-l-4 ${h.tipo==='PAGO'?'border-emerald-500 bg-emerald-50 dark:bg-emerald-900/20':h.tipo==='PRESUPUESTO'?'border-indigo-500 bg-indigo-50 dark:bg-indigo-900/20':h.tipo==='CITA'?'border-amber-500 bg-amber-50 dark:bg-amber-900/20':h.tipo==='SISTEMA'?'border-slate-800 bg-slate-100 dark:bg-slate-900':'border-brand-500'}`}><div className="flex justify-between text-[10px] font-bold text-slate-500 dark:text-slate-400 mb-1"><span>{h.fecha}</span><span>{h.tipo==='EVOLUCION'?'Dr. '+h.odontologo:h.tipo}</span></div><p className="text-sm">{h.motivo}</p></div>)}
                {filtered.length===0&&<div className="p-8 text-center text-slate-300 dark:text-slate-600 text-xs">Sin registros</div>}
            </div>
        </Card>
    </div>
};

const PatientFotos=({patient,imgs,onReload})=>{
    const[uploading,setUploading]=useState(false);const[fullImg,setFullImg]=useState(null);
    const addPhoto=async e=>{const files=Array.from(e.target.files);if(!files.length)return;setUploading(true);for(const f of files){const d=await compress(f);await S.saveImg({paciente_id:patient.id,data:d,date:new Date().toLocaleDateString(),deleted:false})}setUploading(false);onReload()};
    return<Card className="p-3">
        <div className="grid grid-cols-3 gap-2">
            <label className="aspect-square border-2 border-dashed border-slate-300 dark:border-slate-600 rounded-lg flex flex-col items-center justify-center cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-700/30">{uploading?<RefreshCw className="animate-spin" size={20}/>:<><Upload size={20} className="text-slate-400"/><span className="text-[10px] text-slate-400">Subir</span></>}<input type="file" multiple accept="image/*" onChange={addPhoto} className="hidden" disabled={uploading}/></label>
            {imgs.map(i=><div key={i.id} className="relative aspect-square rounded-lg overflow-hidden border border-slate-200 dark:border-slate-700"><img src={i.data} className="w-full h-full object-cover" onClick={()=>setFullImg(i.data)}/><button onClick={async()=>{if(confirm('¿Borrar?')){await S.delImg(i.id);onReload()}}} className="absolute top-1 right-1 bg-red-500 text-white p-0.5 rounded text-[10px]">×</button></div>)}
        </div>
        {imgs.length===0&&<p className="text-center text-slate-400 text-xs mt-3">Sin fotos</p>}
        {fullImg&&<Modal src={fullImg} onClose={()=>setFullImg(null)}/>}
    </Card>
};

const PatientCitas=({patient,apps,onReload})=>{
    const toggle=async(id,val)=>{const a=apps.find(x=>x.id===id);if(a){await S.saveApp({...a,asistio:val});onReload()}};
    const list=apps.sort((a,b)=>new Date(b.fecha+'T'+b.hora)-new Date(a.fecha+'T'+a.hora));
    return<Card className="overflow-hidden">
        <div className="divide-y divide-slate-200 dark:divide-slate-700 max-h-[60vh] overflow-auto">
            {list.map(a=>{const past=isPast(a.fecha,a.hora);return<div key={a.id} className={`p-3 ${past?'opacity-75':''}`}>
                <div className="flex justify-between items-start gap-2">
                    <div className="flex-1 min-w-0"><p className="font-bold text-sm">{a.fecha} • {a.hora}</p><p className="text-xs text-slate-500 dark:text-slate-400">Dr. {a.odontologo}</p>{a.tratamiento&&<p className="text-xs mt-1 text-slate-600 dark:text-slate-300">{a.tratamiento}</p>}</div>
                    <div className="flex gap-1 shrink-0">
                        <button onClick={()=>toggle(a.id,true)} className={`p-1.5 rounded ${a.asistio===true?'bg-emerald-600 text-white':'bg-slate-100 dark:bg-slate-700 text-slate-400'}`}><UserCheck size={14}/></button>
                        <button onClick={()=>toggle(a.id,false)} className={`p-1.5 rounded ${a.asistio===false?'bg-red-600 text-white':'bg-slate-100 dark:bg-slate-700 text-slate-400'}`}><UserX size={14}/></button>
                        <button onClick={async()=>{if(confirm('¿Eliminar?')){await S.delApp(a.id);onReload()}}} className="p-1.5 text-red-400"><Trash2 size={14}/></button>
                    </div>
                </div>
            </div>})}
            {list.length===0&&<div className="p-8 text-center text-slate-300 dark:text-slate-600 text-xs">Sin citas</div>}
        </div>
    </Card>
};

// ===== LISTA DE PACIENTES =====
const PatientsList=({user,onOpen})=>{
    const[pts,setPts]=useState([]);const[search,setSearch]=useState('');
    const[form,setForm]=useState({nombre:'',ci:'',telefono:'',email:''});const[editId,setEditId]=useState(null);
    const[cond,setCond]=useState({});const[saving,setSaving]=useState(false);const[ciDisplay,setCiDisplay]=useState('');const[showForm,setShowForm]=useState(false);

    useEffect(()=>{load()},[]);
    const load=async()=>{const p=await S.getPatients();setPts(p);const c={};for(const pt of p)c[pt.id]=await S.hasCond(pt.id);setCond(c)};
    const handleCIChange=e=>{const raw=e.target.value.replace(/\D/g,'').substring(0,8);setForm({...form,ci:raw});setCiDisplay(formatCI(raw))};
    const submit=async()=>{
        if(!form.nombre||!form.ci)return toast.warn('Nombre y CI obligatorios');
        const ciDuplicate=pts.find(p=>p.ci===form.ci&&(!editId||p.id!==editId));
        if(ciDuplicate)return toast.warn(`Ya existe: ${ciDuplicate.nombre}`);
        setSaving(true);
        try{
            const r=editId?await S.savePatient({id:editId,...form}):await S.savePatient(form);
            if(r){setForm({nombre:'',ci:'',telefono:'',email:''});setCiDisplay('');setEditId(null);setShowForm(false);await load();toast.ok(editId?'Actualizado':'Creado')}
        }finally{setSaving(false)}
    };
    const delPatient=async(p,e)=>{e.stopPropagation();if(!confirm(`¿Eliminar a ${p.nombre}?`))return;if(!confirm('¿Seguro? No se puede deshacer'))return;await S.delPatient(p.id);load()};
    const editPatient=(p,e)=>{e.stopPropagation();setEditId(p.id);setForm({nombre:p.nombre,ci:p.ci,telefono:p.telefono||'',email:p.email||''});setCiDisplay(formatCI(p.ci));setShowForm(true)};
    const filtered=pts.filter(p=>(p.nombre||'').toLowerCase().includes(search.toLowerCase())||(p.ci||'').includes(search));

    return<div className="space-y-4 animate-fade-in">
        {!showForm?<Btn onClick={()=>setShowForm(true)} className="w-full py-3"><UserPlus size={16} className="inline mr-2"/>Nuevo Paciente</Btn>
        :<Card className="p-4">
            <div className="flex justify-between items-center mb-3"><SectionTitle icon={UserPlus}>{editId?'Editar':'Nuevo'} Paciente</SectionTitle><button onClick={()=>{setShowForm(false);setEditId(null);setForm({nombre:'',ci:'',telefono:'',email:''});setCiDisplay('')}}><X size={18} className="text-slate-400"/></button></div>
            <div className="grid grid-cols-2 gap-2">
                <Input placeholder="Nombre *" value={form.nombre} onChange={e=>setForm({...form,nombre:e.target.value})} className="col-span-2" disabled={saving}/>
                <Input placeholder="CI * (2.555.555-3)" value={ciDisplay} onChange={handleCIChange} disabled={saving}/>
                <Input placeholder="Teléfono" value={form.telefono} onChange={e=>setForm({...form,telefono:e.target.value})} disabled={saving}/>
            </div>
            <Btn onClick={submit} disabled={saving} className="w-full mt-3 py-2.5 text-sm">{saving?'Guardando...':'Guardar'}</Btn>
        </Card>}
        <Card className="overflow-hidden">
            <div className="p-3 border-b border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900/50"><div className="relative"><Search className="absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400" size={14}/><Input placeholder="Buscar nombre o CI..." value={search} onChange={e=>setSearch(e.target.value)} className="pl-8 py-2"/></div></div>
            <div className="divide-y divide-slate-200 dark:divide-slate-700 max-h-[60vh] overflow-auto">
                {filtered.map(p=><button key={p.id} onClick={()=>onOpen(p.id)} className={`w-full p-3 text-left hover:bg-slate-50 dark:hover:bg-slate-700/30 transition-colors ${cond[p.id]?'border-l-4 border-pink-500 bg-pink-50/50 dark:bg-pink-900/10':''}`}>
                    <div className="flex justify-between items-center gap-2">
                        <div className="min-w-0 flex-1"><p className="font-bold text-sm truncate">{p.nombre}{cond[p.id]&&<span className="ml-1 bg-pink-500 text-white text-[8px] px-1.5 py-0.5 rounded-full">⚠️</span>}</p><p className="text-[10px] text-slate-400">CI: {formatCI(p.ci)} • Tel: {p.telefono||'-'}</p></div>
                        <div className="flex gap-1 shrink-0">
                            <span onClick={e=>editPatient(p,e)} className="p-2 text-brand-500 hover:bg-brand-50 dark:hover:bg-brand-900/30 rounded cursor-pointer"><Edit2 size={14}/></span>
                            <span onClick={e=>delPatient(p,e)} className="p-2 text-red-500 hover:bg-red-50 dark:hover:bg-red-900/30 rounded cursor-pointer"><Trash2 size={14}/></span>
                        </div>
                    </div>
                </button>)}
                {filtered.length===0&&<div className="p-8 text-center text-slate-300 dark:text-slate-600 text-xs">{search?'Sin resultados':'Sin pacientes'}</div>}
            </div>
        </Card>
    </div>
};

// ===== ADMIN =====
const Admin=({user,online})=>{
    const isAdmin=user.role===Role.ADMIN;
    const[tab,setTab]=useState(isAdmin?'users':'backup');
    const[users,setUsers]=useState([]);
    const[uForm,setUForm]=useState({name:'',username:'',email:'',password:'',role:Role.USUARIO});
    const[editId,setEditId]=useState(null);const[saving,setSaving]=useState(false);
    const fileRef=useRef();

    useEffect(()=>{if(tab==='users')S.getUsers().then(setUsers)},[tab]);

    const saveUser=async()=>{
        setSaving(true);
        try{
            if(editId){
                if(!uForm.name||!uForm.username)return toast.warn('Nombre y usuario obligatorios');
                const r=await S.updateUserMeta({id:editId,name:uForm.name,username:uForm.username,role:uForm.role});
                if(r){setUForm({name:'',username:'',email:'',password:'',role:Role.USUARIO});setEditId(null);setUsers(await S.getUsers());toast.ok('Usuario actualizado')}
            }else{
                if(!uForm.name||!uForm.username||!uForm.email||!uForm.password)return toast.warn('Complete todos los campos');
                const r=await S.createUser(uForm);
                if(r.ok){setUForm({name:'',username:'',email:'',password:'',role:Role.USUARIO});setUsers(await S.getUsers());toast.ok('Usuario creado')}
                else toast.err(r.err);
            }
        }finally{setSaving(false)}
    };

    return<div className="space-y-4 animate-fade-in">
        <div className="flex gap-2 overflow-x-auto pb-2">
            {isAdmin&&<button onClick={()=>setTab('users')} className={`px-4 py-2 rounded-lg text-xs font-bold whitespace-nowrap ${tab==='users'?'bg-brand-600 text-white':'bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-500 dark:text-slate-400'}`}>Usuarios</button>}
            <button onClick={()=>setTab('backup')} className={`px-4 py-2 rounded-lg text-xs font-bold whitespace-nowrap ${tab==='backup'?'bg-emerald-600 text-white':'bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-500 dark:text-slate-400'}`}>Backup</button>
            <button onClick={()=>setTab('info')} className={`px-4 py-2 rounded-lg text-xs font-bold whitespace-nowrap ${tab==='info'?'bg-indigo-600 text-white':'bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-500 dark:text-slate-400'}`}>Sistema</button>
        </div>

        {tab==='users'&&isAdmin&&<div className="space-y-4">
            <Card className="p-4">
                <SectionTitle>{editId?'Editar':'Nuevo'} Usuario</SectionTitle>
                <div className="space-y-2">
                    <Input placeholder="Nombre" value={uForm.name} onChange={e=>setUForm({...uForm,name:e.target.value})}/>
                    <Input placeholder="Usuario (minúsculas)" value={uForm.username} onChange={e=>setUForm({...uForm,username:e.target.value.toLowerCase()})} autoCapitalize="none"/>
                    {!editId&&<Input type="email" placeholder="Email" value={uForm.email} onChange={e=>setUForm({...uForm,email:e.target.value.toLowerCase()})} autoCapitalize="none"/>}
                    {!editId&&<Input type="password" placeholder="Contraseña (mín. 6)" value={uForm.password} onChange={e=>setUForm({...uForm,password:e.target.value})}/>}
                    <Select value={uForm.role} onChange={e=>setUForm({...uForm,role:e.target.value})}><option value={Role.USUARIO}>Usuario</option><option value={Role.ODONTOLOGO}>Odontólogo</option><option value={Role.ADMIN}>Administrador</option></Select>
                    <Btn onClick={saveUser} disabled={saving} className="w-full py-2.5 text-sm">{saving?'Guardando...':'Guardar'}</Btn>
                    {editId&&<Btn variant="secondary" onClick={()=>{setEditId(null);setUForm({name:'',username:'',email:'',password:'',role:Role.USUARIO})}} className="w-full py-2 text-sm">Cancelar</Btn>}
                    {!editId&&<p className="text-[10px] text-amber-600 dark:text-amber-400">⚠️ Desactivá "Confirm email" en Supabase</p>}
                </div>
            </Card>
            <Card className="overflow-hidden divide-y divide-slate-200 dark:divide-slate-700">{users.map(u=><div key={u.id} className="p-3 flex justify-between items-center"><div><p className="font-bold text-sm">{u.name}</p><p className="text-[10px] text-slate-400">@{u.username} • {u.email} • {u.role}</p></div><div className="flex gap-1"><button onClick={()=>{setEditId(u.id);setUForm({name:u.name,username:u.username,email:u.email||'',password:'',role:u.role})}} className="p-2 text-brand-500"><Edit2 size={14}/></button><button onClick={async()=>{if(u.email===user.email)return toast.warn('No podés eliminarte');if(confirm('¿Eliminar? (Borrá también la cuenta en Auth manualmente)')){const ok=await S.delUser(u.id);if(ok){setUsers(await S.getUsers());toast.ok('Eliminado')}}}} className="p-2 text-red-400"><Trash2 size={14}/></button></div></div>)}</Card>
        </div>}

        {tab==='backup'&&<div className="space-y-4">
            <Card className="p-6 text-center"><Download size={32} className="mx-auto text-brand-600 dark:text-brand-400 mb-2"/><h4 className="font-bold mb-2">Exportar</h4><p className="text-[10px] text-slate-400 mb-3">Pacientes, citas, historial, fichas, fotos</p><Btn onClick={async()=>{const d=await S.export();const b=new Blob([d],{type:'application/json'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='ArteDental_'+new Date().toISOString().split('T')[0]+'.json';a.click()}} className="w-full py-3 text-sm">Descargar</Btn></Card>
            <Card className="p-6 text-center"><Upload size={32} className="mx-auto text-emerald-600 dark:text-emerald-400 mb-2"/><h4 className="font-bold mb-2">Importar</h4><input type="file" ref={fileRef} accept=".json" className="hidden" onChange={async e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=async ev=>{if(await S.import(ev.target.result)){toast.ok('Importado, recargando...');setTimeout(()=>window.location.reload(),1500)}};r.readAsText(f)}}/><Btn variant="success" onClick={()=>fileRef.current.click()} className="w-full py-3 text-sm">Cargar</Btn></Card>
        </div>}

        {tab==='info'&&<div className="bg-gradient-to-br from-slate-800 to-indigo-900 p-6 rounded-xl text-white text-center"><Cloud size={40} className="mx-auto mb-2"/><h4 className="text-lg font-bold mb-2">Sistema en la Nube</h4><p className="text-white/80 text-sm mb-3">Supabase Auth + Database</p><div className={`inline-flex items-center gap-2 px-4 py-2 rounded-full ${online?'bg-emerald-500':'bg-red-500'}`}>{online?<><Wifi size={16}/>Conectado</>:<><WifiOff size={16}/>Offline</>}</div><p className="text-white/60 text-[10px] mt-3">v3.0 • Hub centralizado • Tema oscuro</p></div>}
    </div>
};

// ===== APP PRINCIPAL =====
const App=()=>{
    const[user,setUser]=useState(null);
    const[tab,setTab]=useState('dashboard');
    const[pid,setPid]=useState(null);
    const[loading,setLoading]=useState(true);
    const[online,setOnline]=useState(false);
    const[showPass,setShowPass]=useState(false);
    const[dark,toggleDark]=useTheme();

    useEffect(()=>{(async()=>{
        const ok=await S.init();setOnline(ok);
        if(ok){const u=await S.getCurrentUser();if(u)setUser(u)}
        setLoading(false);
    })()},[]);

    useEffect(()=>{const onFocus=async()=>setOnline(await DB.check());window.addEventListener('focus',onFocus);return()=>window.removeEventListener('focus',onFocus)},[]);

    useEffect(()=>{
        if(!user)return;
        let timer;
        const reset=()=>{clearTimeout(timer);timer=setTimeout(async()=>{toast.warn('Sesión cerrada por inactividad');await supabase.auth.signOut();setUser(null)},INACTIVITY_MS)};
        const events=['mousedown','keydown','touchstart','scroll'];
        events.forEach(e=>window.addEventListener(e,reset));reset();
        return()=>{clearTimeout(timer);events.forEach(e=>window.removeEventListener(e,reset))};
    },[user]);

    const logout=async()=>{await supabase.auth.signOut();setUser(null);setPid(null);toast.ok('Sesión cerrada')};

    const openPatient=(id)=>{setPid(id);setTab('pacientes')};
    const goTab=(t)=>{setTab(t);setPid(null)};

    if(loading)return<><Toasts/><div className="min-h-screen flex flex-col items-center justify-center bg-gradient-to-br from-slate-800 to-indigo-900 text-white safe-top safe-bottom"><RefreshCw className="animate-spin mb-3" size={40}/><p className="font-bold">Conectando...</p></div></>;
    if(!user)return<><Toasts/><Login onLogin={setUser} online={online}/></>;

    const tabs=[
        {id:'dashboard',label:'Inicio',icon:LayoutDashboard},
        {id:'agenda',label:'Agenda',icon:Calendar},
        {id:'pacientes',label:'Pacientes (Ficha e Historial)',icon:Users},
        {id:'admin',label:'Sistema',icon:Shield}
    ];

    return<div className="min-h-screen flex flex-col">
        <Toasts/>
        {showPass&&<div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4"><Card className="w-full max-w-xs p-5"><h3 className="font-bold text-brand-600 dark:text-brand-400 mb-3">Cambiar mi Contraseña</h3><Input id="np" type="password" placeholder="Nueva (mín. 6)" className="mb-3"/><div className="flex gap-2"><Btn onClick={async()=>{const np=document.getElementById('np').value;const r=await S.changeOwnPassword(np);if(r.ok){setShowPass(false);toast.ok('Contraseña cambiada')}else toast.warn(r.err)}} className="flex-1 py-2 text-sm">Guardar</Btn><Btn variant="secondary" onClick={()=>setShowPass(false)} className="flex-1 py-2 text-sm">Cancelar</Btn></div></Card></div>}

        <header className="bg-slate-800 dark:bg-slate-950 text-white p-3 safe-top no-print border-b border-slate-700">
            <div className="flex justify-between items-center">
                <div className="flex items-center gap-2"><span className="text-xl">🦷</span><span className="font-bold">Arte Dental</span></div>
                <div className="flex items-center gap-2">
                    <Status on={online}/>
                    <button onClick={toggleDark} className="p-2 bg-slate-700 dark:bg-slate-800 rounded-lg hover:bg-slate-600" title={dark?'Tema claro':'Tema oscuro'}>{dark?<Sun size={16}/>:<Moon size={16}/>}</button>
                    <button onClick={()=>setShowPass(true)} className="p-2 bg-slate-700 dark:bg-slate-800 rounded-lg hover:bg-slate-600" title="Cambiar contraseña"><Key size={16}/></button>
                    <button onClick={logout} className="p-2 bg-slate-700 dark:bg-slate-800 rounded-lg hover:bg-slate-600" title="Cerrar sesión"><LogOut size={16}/></button>
                </div>
            </div>
        </header>

        <nav className="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 px-2 py-1 flex gap-1 overflow-x-auto scrollbar-hide no-print">
            {tabs.map(t=><button key={t.id} onClick={()=>goTab(t.id)} className={`flex items-center gap-1.5 px-3 py-2 rounded-lg text-xs font-bold whitespace-nowrap ${tab===t.id?'bg-brand-100 dark:bg-brand-900/40 text-brand-600 dark:text-brand-300':'text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700/50'}`}><t.icon size={14}/>{t.label}</button>)}
        </nav>

        <main className="flex-1 p-3 overflow-auto safe-bottom">
            {tab==='dashboard'&&<Dashboard user={user} onOpenPatient={openPatient}/>}
            {tab==='agenda'&&<Agenda user={user} onOpenPatient={openPatient}/>}
            {tab==='pacientes'&&!pid&&<PatientsList user={user} onOpen={setPid}/>}
            {tab==='pacientes'&&pid&&<PatientHub user={user} patientId={pid} onBack={()=>setPid(null)}/>}
            {tab==='admin'&&<Admin user={user} online={online}/>}
        </main>

        <footer className="p-2 text-center text-[10px] text-slate-400 no-print safe-bottom">Arte Dental © 2025 • v3.0 • {online?'🟢':'🔴'}</footer>
    </div>
};

createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
