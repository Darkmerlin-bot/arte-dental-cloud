<body class="text-slate-800 dark:text-slate-100">
<!-- Splash inmediato mientras arranca la app -->
<div id="splash"><div class="logo">🦷</div><div style="font-size:20px;font-weight:bold">Arte Dental</div><div class="spinner"></div><div class="label">Cargando...</div></div>
<div id="root"></div>
<script>
  // Oculta el splash cuando la app dibuja algo. Si algo falla al arrancar, muestra un aviso con "Reintentar" en vez de pantalla blanca.
  (function(){
    var splash=document.getElementById('splash'),root=document.getElementById('root');
    var hide=function(){if(splash&&splash.parentNode){splash.classList.add('hidden');setTimeout(function(){splash.remove()},350)}};
    var obs=new MutationObserver(function(){if(root.children.length>0){hide();obs.disconnect()}});
    obs.observe(root,{childList:true});
    window.__bootFail=function(msg){
      if(root.children.length>0)return;
      hide();
      root.innerHTML='<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(135deg,#1e293b,#312e81);font-family:system-ui,sans-serif"><div style="max-width:340px;background:#fff;border-radius:16px;padding:24px;text-align:center;color:#0f172a"><div style="font-size:40px">🦷</div><h1 style="font-size:18px;margin:8px 0">No se pudo iniciar Arte Dental</h1><p style="font-size:14px;color:#475569;margin:0 0 16px">Revisá la conexión a internet y probá de nuevo.</p><button onclick="location.reload()" style="background:#4f46e5;color:#fff;border:0;border-radius:12px;padding:12px 20px;font-size:15px;font-weight:700;width:100%">Reintentar</button><p style="font-size:12px;color:#94a3b8;margin-top:12px;word-break:break-word">'+String(msg||'').replace(/[<>&]/g,'')+'</p></div></div>';
